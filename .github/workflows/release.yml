# Release / tag gate (GUMP-N003 / W04 / CONFORMANCE §9).
# Ordinary PR CI keeps structural + --prove-missing self-test.
# Tags must pass --strict: no missing/blocked ledger rows.
name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  release-gate:
    name: strict-traceability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (MSRV)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85.0"
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Traceability strict gate (fail on missing/blocked)
        run: cargo run -p gump-gates --bin check-traceability -- --strict
