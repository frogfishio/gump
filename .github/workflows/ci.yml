name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gump-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  # One monotonic identity shared by every architecture and package in this run.
  # GitHub permanently records this counter; local `make dist` uses BUILD instead.
  GUMP_BUILD: ${{ github.run_number }}

jobs:
  check:
    name: build-test-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (MSRV)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85.0"
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Release and licensing metadata
        run: make check-release-metadata

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Traceability structural gate
        # Includes ticket ownership on missing/blocked (GUMP-N003). Strict is release-only.
        run: cargo run -p gump-gates --bin check-traceability

      - name: Validate release tag and version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          expected="v$(tr -d '[:space:]' < VERSION)"
          test "$GITHUB_REF_NAME" = "$expected" || {
            echo "release tag $GITHUB_REF_NAME does not match VERSION ($expected)" >&2
            exit 1
          }

      - name: Traceability strict release gate
        if: startsWith(github.ref, 'refs/tags/')
        run: cargo run -p gump-gates --bin check-traceability -- --strict

      - name: Prove missing requirements fail strict CI gate (W04)
        # Self-test only — not a completion signal (must keep failing while ledger open).
        run: cargo run -p gump-gates --bin check-traceability -- --prove-missing

  # STL-19 fail-closed compatibility path. MinIO currently ignores the
  # destination If-None-Match precondition on CopyObject, so it is a negative
  # provider fixture—not evidence that immutable D02 publication succeeded.
  s3-minio:
    name: s3-minio-rejected-safely
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (MSRV)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85.0"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Start MinIO
        run: |
          docker run -d --name gump-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=gump \
            -e MINIO_ROOT_PASSWORD=gumpsecret \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data --console-address ":9001"
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:9000/minio/health/live >/dev/null; then
              echo "MinIO healthy"
              exit 0
            fi
            sleep 1
          done
          echo "MinIO failed to become healthy" >&2
          docker logs gump-minio || true
          exit 1

      - name: Prove incompatible conditional copy is rejected
        env:
          GUMP_S3_ENDPOINT: http://127.0.0.1:9000
          GUMP_S3_BUCKET: gump
          GUMP_S3_ACCESS_KEY: gump
          GUMP_S3_SECRET_KEY: gumpsecret
          GUMP_S3_REGION: us-east-1
          GUMP_S3_REQUIRED: "1"
        run: >-
          cargo test -p gump-connectors --test d02_s3_publish
          s3_rejects_endpoint_without_conditional_copy -- --exact --nocapture

  dist:
    name: dist-${{ matrix.target }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build native distribution asset
        run: make dist-native TARGET="${{ matrix.target }}"

      - name: Smoke-test and verify asset
        run: |
          "dist/bin/${{ matrix.target }}/gump" --help
          expected="$(tr -d '[:space:]' < VERSION)+build-${GUMP_BUILD}"
          test "$("dist/bin/${{ matrix.target }}/gump" --version)" = "$expected"
          test "$(cat "dist/bin/${{ matrix.target }}/BUILD_INFO")" = "$expected"
          test "$("dist/bin/${{ matrix.target }}/gump" --copyright | wc -l | tr -d ' ')" = 2
          file "dist/bin/${{ matrix.target }}/gump"
          cd "dist/bin/${{ matrix.target }}"
          shasum -a 256 -c SHA256SUMS

      - name: Upload distribution asset
        uses: actions/upload-artifact@v4
        with:
          name: gump-${{ matrix.target }}
          path: dist/bin/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 14

  deb:
    name: deb-${{ matrix.architecture }}
    needs: dist
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            architecture: amd64
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Download native Gump asset
        uses: actions/download-artifact@v4
        with:
          name: gump-${{ matrix.target }}
          path: dist/bin/${{ matrix.target }}

      - name: Build Debian package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          chmod 0755 "dist/bin/$TARGET/gump"
          version="$(tr -d '[:space:]' < VERSION)+build${GUMP_BUILD}"
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          make deb TARGET="$TARGET" DEB_VERSION="$version"

      - name: Inspect, install, and smoke-test package
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          TARGET: ${{ matrix.target }}
        run: |
          package=$(find dist/packages/deb -name "gump_*_${ARCHITECTURE}.deb" -print -quit)
          test -n "$package"
          dpkg-deb --info "$package"
          dpkg-deb --contents "$package"
          test "$(dpkg-deb --field "$package" Architecture)" = "$ARCHITECTURE"
          test "$(dpkg-deb --field "$package" Package)" = gump
          expected=$(sha256sum "dist/bin/$TARGET/gump" | awk '{print $1}')
          sudo apt-get install -y "./$package"
          /usr/bin/gump --help
          test "$(/usr/bin/gump --version)" = "$(tr -d '[:space:]' < VERSION)+build-${GUMP_BUILD}"
          test "$(/usr/bin/gump --copyright | wc -l | tr -d ' ')" = 2
          test -f /usr/share/doc/gump/LICENSE
          test -f /usr/share/doc/gump/NOTICE
          test "$(dpkg-query -W -f='${Status}' gump)" = "install ok installed"
          actual=$(sha256sum /usr/bin/gump | awk '{print $1}')
          test "$actual" = "$expected"
          test ! -e /usr/lib/systemd/system/gump.service
          test ! -e /etc/gump
          test ! -e /var/lib/gump

      - name: Verify package checksum
        run: |
          cd dist/packages/deb
          sha256sum -c ./*.sha256

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: gump-deb-${{ matrix.architecture }}
          path: |
            dist/packages/deb/*.deb
            dist/packages/deb/*.sha256
          if-no-files-found: error
          retention-days: 14

  rpm:
    name: rpm-${{ matrix.architecture }}
    needs: dist
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            architecture: x86_64
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            architecture: aarch64
    runs-on: ${{ matrix.runner }}
    container: fedora:43
    steps:
      - name: Install RPM build tools
        run: dnf -y install git make rpm-build file findutils tar gzip

      - uses: actions/checkout@v4

      - name: Download native Gump asset
        uses: actions/download-artifact@v4
        with:
          name: gump-${{ matrix.target }}
          path: dist/bin/${{ matrix.target }}

      - name: Build RPM package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          chmod 0755 "dist/bin/$TARGET/gump"
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          make rpm \
            TARGET="$TARGET" \
            RPM_VERSION="$(tr -d '[:space:]' < VERSION)" \
            RPM_RELEASE="build${GUMP_BUILD}"

      - name: Inspect, install, and smoke-test package
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          TARGET: ${{ matrix.target }}
        run: |
          package=$(find dist/packages/rpm -name "gump-*.$ARCHITECTURE.rpm" -print -quit)
          test -n "$package"
          rpm -qip "$package"
          rpm -qlp "$package"
          rpm -qRp "$package"
          test "$(rpm -qp --qf '%{ARCH}' "$package")" = "$ARCHITECTURE"
          test "$(rpm -qp --qf '%{NAME}' "$package")" = gump
          test "$(rpm -qp --qf '%{LICENSE}' "$package")" = AGPL-3.0-or-later
          test -z "$(rpm -qp --scripts "$package")"
          expected=$(sha256sum "dist/bin/$TARGET/gump" | awk '{print $1}')
          rpm -Uvh "$package"
          /usr/bin/gump --help
          test "$(/usr/bin/gump --version)" = "$(tr -d '[:space:]' < VERSION)+build-${GUMP_BUILD}"
          test "$(/usr/bin/gump --copyright | wc -l | tr -d ' ')" = 2
          test -f /usr/share/licenses/gump/LICENSE
          test -f /usr/share/doc/gump/NOTICE
          test "$(rpm -q --qf '%{NAME}' gump)" = gump
          actual=$(sha256sum /usr/bin/gump | awk '{print $1}')
          test "$actual" = "$expected"
          test ! -e /usr/lib/systemd/system/gump.service
          test ! -e /etc/gump
          test ! -e /var/lib/gump

      - name: Verify package checksum
        run: |
          cd dist/packages/rpm
          sha256sum -c ./*.sha256

      - name: Upload RPM package
        uses: actions/upload-artifact@v4
        with:
          name: gump-rpm-${{ matrix.architecture }}
          path: |
            dist/packages/rpm/*.rpm
            dist/packages/rpm/*.sha256
          if-no-files-found: error
          retention-days: 14

  prepare-release:
    name: prepare-signed-release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [check, s3-minio, dist, deb, rpm]
    runs-on: ubuntu-22.04
    env:
      GUMP_PACKAGE_SIGNING_KEY: ${{ secrets.GUMP_PACKAGE_SIGNING_KEY }}
      GUMP_PACKAGE_SIGNING_PASSPHRASE: ${{ secrets.GUMP_PACKAGE_SIGNING_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4

      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils createrepo-c dpkg-dev rpm

      - name: Download validated build artifacts
        uses: actions/download-artifact@v4
        with:
          path: incoming

      - name: Import CI signing subkey
        run: |
          test -n "$GUMP_PACKAGE_SIGNING_KEY"
          test -n "$GUMP_PACKAGE_SIGNING_PASSPHRASE"
          GNUPGHOME="$RUNNER_TEMP/gump-gnupg"
          export GNUPGHOME
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          install -d -m 0700 "$GNUPGHOME"
          printf '%s' "$GUMP_PACKAGE_SIGNING_KEY" | gpg --batch --import
          expected=$(tr -d '[:space:]' < packaging/repository/SIGNING_KEY)
          actual=$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')
          test "$actual" = "$expected"

      - name: Sign RPM packages
        run: |
          chmod 0755 packaging/rpm/sign-rpms.sh
          fingerprint=$(tr -d '[:space:]' < packaging/repository/SIGNING_KEY)
          packaging/rpm/sign-rpms.sh "$fingerprint" incoming

      - name: Assemble release assets
        run: |
          install -d release-assets
          version=$(tr -d '[:space:]' < VERSION)
          for target in \
            aarch64-apple-darwin \
            x86_64-unknown-linux-gnu \
            aarch64-unknown-linux-gnu
          do
            source="incoming/gump-$target"
            test -x "$source/gump"
            archive="release-assets/gump-$target.tar.gz"
            tar -C "$source" -czf "$archive" gump BUILD_INFO
          done
          find incoming -type f \( -name '*.deb' -o -name '*.rpm' \) \
            -exec cp {} release-assets/ \;
          cp LICENSE NOTICE release-assets/
          printf '%s\n' "$version" > release-assets/VERSION
          (
            cd release-assets
            sha256sum -- ./*
          ) > release-SHA256SUMS
          mv release-SHA256SUMS release-assets/SHA256SUMS

      - name: Build signed APT and RPM repositories
        run: |
          chmod 0755 packaging/repository/build-repositories.sh
          fingerprint=$(tr -d '[:space:]' < packaging/repository/SIGNING_KEY)
          packaging/repository/build-repositories.sh \
            --deb-dir incoming \
            --rpm-dir incoming \
            --output site/packages \
            --signing-key "$fingerprint"
          touch site/.nojekyll

      - name: Render Homebrew formula
        run: |
          chmod 0755 packaging/homebrew/render-formula.sh
          version=$(tr -d '[:space:]' < VERSION)
          checksum=$(sha256sum release-assets/gump-aarch64-apple-darwin.tar.gz | awk '{print $1}')
          packaging/homebrew/render-formula.sh \
            "$version" "$GITHUB_REF_NAME" "$checksum" tap/Formula/gump.rb

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: gump-release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Homebrew formula
        uses: actions/upload-artifact@v4
        with:
          name: gump-homebrew-formula
          path: tap/Formula/gump.rb
          if-no-files-found: error
          retention-days: 14

      - name: Upload package repository for Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  publish-release:
    name: publish-github-release
    if: startsWith(github.ref, 'refs/tags/')
    needs: prepare-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gump-release-assets
          path: release-assets

      - name: Attest release provenance
        uses: actions/attest@v4
        with:
          subject-path: release-assets/*

      - name: Publish immutable release candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --verify-tag \
              --title "Gump ${GITHUB_REF_NAME#v}" \
              --generate-notes
          fi

  publish-package-repositories:
    name: publish-apt-rpm-repositories
    if: startsWith(github.ref, 'refs/tags/')
    needs: [prepare-release, publish-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy signed repositories
        id: deployment
        uses: actions/deploy-pages@v4

  publish-homebrew:
    name: publish-homebrew-formula
    if: startsWith(github.ref, 'refs/tags/')
    needs: [prepare-release, publish-release]
    runs-on: ubuntu-latest
    steps:
      - name: Download generated formula
        uses: actions/download-artifact@v4
        with:
          name: gump-homebrew-formula
          path: generated

      - name: Check out Frogfish Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: frogfishio/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: homebrew-tap

      - name: Publish formula
        run: |
          install -d homebrew-tap/Formula
          install -m 0644 generated/gump.rb homebrew-tap/Formula/gump.rb
          cd homebrew-tap
          if test -z "$(git status --porcelain -- Formula/gump.rb)"; then
            echo "Homebrew formula is already current"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Formula/gump.rb
          git commit -m "gump ${GITHUB_REF_NAME}"
          git push
