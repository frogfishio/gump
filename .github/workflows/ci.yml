name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  check:
    name: build-test-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (MSRV)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85.0"
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Traceability structural gate
        # Includes ticket ownership on missing/blocked (GUMP-N003). Strict is release-only.
        run: cargo run -p gump-gates --bin check-traceability

      - name: Prove missing requirements fail strict CI gate (W04)
        # Self-test only — not a completion signal (must keep failing while ledger open).
        run: cargo run -p gump-gates --bin check-traceability -- --prove-missing

  # Optional live S3 path (STL-07 / STL-19 / D02). Default `check` stays green without MinIO.
  s3-minio:
    name: d02-minio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (MSRV)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85.0"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Start MinIO
        run: |
          docker run -d --name gump-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=gump \
            -e MINIO_ROOT_PASSWORD=gumpsecret \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data --console-address ":9001"
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:9000/minio/health/live >/dev/null; then
              echo "MinIO healthy"
              exit 0
            fi
            sleep 1
          done
          echo "MinIO failed to become healthy" >&2
          docker logs gump-minio || true
          exit 1

      - name: D02 quarantine→promote against MinIO
        env:
          GUMP_S3_ENDPOINT: http://127.0.0.1:9000
          GUMP_S3_BUCKET: gump
          GUMP_S3_ACCESS_KEY: gump
          GUMP_S3_SECRET_KEY: gumpsecret
          GUMP_S3_REGION: us-east-1
          GUMP_S3_REQUIRED: "1"
        run: cargo test -p gump-connectors --test d02_s3_publish -- --nocapture

  dist:
    name: dist-${{ matrix.target }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build native distribution asset
        run: make dist-native TARGET="${{ matrix.target }}"

      - name: Smoke-test and verify asset
        run: |
          "dist/bin/${{ matrix.target }}/gump" --help
          file "dist/bin/${{ matrix.target }}/gump"
          cd "dist/bin/${{ matrix.target }}"
          shasum -a 256 -c SHA256SUMS

      - name: Upload distribution asset
        uses: actions/upload-artifact@v4
        with:
          name: gump-${{ matrix.target }}
          path: dist/bin/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 14
