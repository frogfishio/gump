name: Publish testing package repositories

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gump-testing-package-repositories
  cancel-in-progress: false

jobs:
  publish:
    name: publish-signed-testing-apt-rpm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out signed repository snapshot
        uses: actions/checkout@v6
        with:
          ref: gh-pages

      - name: Upload package repository
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy package repository
        id: deployment
        uses: actions/deploy-pages@v5
