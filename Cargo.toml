[workspace]
resolver = "2"
members = [
    "crates/gump-types",
    "crates/gump-cli",
    "crates/gump-manifest",
    "crates/gump-capsule",
    "crates/gump-crypto",
    "crates/gump-protocol",
    "crates/gump-memory",
    "crates/gump-transport",
    "crates/gump-scheduler",
    "crates/gump-agent",
    "crates/gump-driver",
    "crates/gump-telemetry",
    "crates/gump-connectors",
    "crates/gump-server",
    "crates/gump-gates",
]
default-members = [
    "crates/gump-cli",
    "crates/gump-server",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Path members — pin early so later tickets share one edge set.
gump-agent = { path = "crates/gump-agent" }
gump-capsule = { path = "crates/gump-capsule" }
gump-cli = { path = "crates/gump-cli" }
gump-connectors = { path = "crates/gump-connectors" }
gump-crypto = { path = "crates/gump-crypto" }
gump-driver = { path = "crates/gump-driver" }
gump-manifest = { path = "crates/gump-manifest" }
gump-memory = { path = "crates/gump-memory" }
gump-protocol = { path = "crates/gump-protocol" }
gump-scheduler = { path = "crates/gump-scheduler" }
gump-server = { path = "crates/gump-server" }
gump-telemetry = { path = "crates/gump-telemetry" }
gump-transport = { path = "crates/gump-transport" }
gump-types = { path = "crates/gump-types" }

serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
serde_json = "1.0"
capsule-lib = "1.0"
globset = "=0.4.16" # MSRV 1.85; 0.4.20+ needs rustc 1.88
blake3 = "1.5"
ratatouille = "0.1"
zstd = { version = "0.13", default-features = false }
unicode-normalization = "0.1"
ed25519-dalek = { version = "3", features = ["rand_core"] }
chacha20poly1305 = "0.11"
hpke = { version = "0.14", default-features = false, features = ["x25519", "chacha", "alloc", "getrandom"] }
zeroize = { version = "1.8", features = ["derive"] }
rand_core = "0.10"
getrandom = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync", "io-util"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
rustls-pki-types = "1.11"
rcgen = "0.13"
x509-parser = "0.16"
# Pin for MSRV 1.85 (newer time requires rustc 1.88+).
time = "=0.3.41"
openraft = { version = "=0.9.25", features = ["serde", "storage-v2"] }
tracing = "0.1"
# Pin for MSRV 1.85 (openraft pulls newer validit needing rustc 1.88).
validit = "=0.2.4"
tempfile = "3"
