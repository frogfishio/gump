syntax = "proto3";

package gump.v1;

import "gump/v1/formats.proto";

enum MessageType {
  MESSAGE_TYPE_UNSPECIFIED = 0;
  MESSAGE_TYPE_HELLO = 1;
  MESSAGE_TYPE_REQUEST = 2;
  MESSAGE_TYPE_RESPONSE = 3;
  MESSAGE_TYPE_WATCH_EVENT = 4;
  MESSAGE_TYPE_TELEMETRY_BATCH = 5;
  MESSAGE_TYPE_BULK_OPEN = 6;
}

enum RetryClass {
  RETRY_CLASS_UNSPECIFIED = 0;
  RETRY_CLASS_NEVER = 1;
  RETRY_CLASS_SAME_OPERATION = 2;
  RETRY_CLASS_AFTER_STATE_CHANGE = 3;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_ARGUMENT = 1;
  ERROR_CODE_SOURCE_CHANGED = 2;
  ERROR_CODE_UNAUTHENTICATED = 3;
  ERROR_CODE_UNAUTHORIZED = 4;
  ERROR_CODE_WRONG_CLUSTER = 5;
  ERROR_CODE_WRONG_INCARNATION = 6;
  ERROR_CODE_INCOMPATIBLE_VERSION = 7;
  ERROR_CODE_NOT_FOUND = 8;
  ERROR_CODE_ALREADY_EXISTS = 9;
  ERROR_CODE_CONFLICT = 10;
  ERROR_CODE_STALE_REVISION = 11;
  ERROR_CODE_STALE_GENERATION = 12;
  ERROR_CODE_STALE_FENCE = 13;
  ERROR_CODE_NOT_LEADER = 14;
  ERROR_CODE_QUORUM_UNAVAILABLE = 15;
  ERROR_CODE_COMPACTED = 16;
  ERROR_CODE_LEASE_EXPIRED = 17;
  ERROR_CODE_UNSCHEDULABLE = 18;
  ERROR_CODE_CAPABILITY_UNAVAILABLE = 19;
  ERROR_CODE_ISOLATION_UNAVAILABLE = 20;
  ERROR_CODE_CAPSULE_INVALID = 21;
  ERROR_CODE_SIGNATURE_INVALID = 22;
  ERROR_CODE_UNSEAL_REQUIRED = 23;
  ERROR_CODE_SECRET_DELIVERY_DENIED = 24;
  ERROR_CODE_OBJECT_STORE_FAILED = 25;
  ERROR_CODE_PUBLICATION_FAILED = 26;
  ERROR_CODE_TELEMETRY_OVERLOADED = 27;
  ERROR_CODE_RESOURCE_EXHAUSTED = 28;
  ERROR_CODE_DEADLINE_EXCEEDED = 29;
  ERROR_CODE_RETRY_LATER = 30;
  ERROR_CODE_INTERNAL = 31;
}

message EnvelopeV1 {
  uint32 protocol_major = 1;
  uint32 protocol_minor = 2;
  MessageType message_type = 3;
  bytes cluster_id = 4;
  bytes cluster_incarnation = 5;
  bytes sender_node_id = 6;
  uint64 sender_incarnation = 7;
  bytes message_id = 8;
  optional bytes correlation_id = 9;
  optional bytes operation_id = 10;
  int64 sent_unix_ms = 11;
  bytes body = 12;
}

message ErrorV1 {
  ErrorCode code = 1;
  string reason = 2;
  string safe_message = 3;
  optional string field_path = 4;
  RetryClass retry_class = 5;
  optional uint64 retry_after_ms = 6;
  repeated NamedValueV1 details = 7; // sorted name, closed names per error
}

message HelloV1 {
  bytes node_id = 1;
  uint64 node_incarnation = 2;
  uint32 minimum_major = 3;
  uint32 maximum_major = 4;
  uint32 minimum_minor = 5;
  uint32 maximum_minor = 6;
  repeated string roles = 7;        // sorted
  repeated string capabilities = 8; // sorted
  uint32 maximum_control_frame = 9;
  uint32 maximum_bulk_chunk = 10;
  optional uint64 raft_node_id = 11;
  bytes connection_nonce = 12;
}

message FenceV1 {
  uint64 controller_epoch = 1;
  bytes controller_fence = 2;
  uint64 declaration_generation = 3;
  uint64 object_revision = 4;
  uint64 valid_for_ms = 5;
}

enum CompareKind {
  COMPARE_KIND_UNSPECIFIED = 0;
  COMPARE_KIND_ABSENT = 1;
  COMPARE_KIND_REVISION = 2;
  COMPARE_KIND_DIGEST = 3;
  COMPARE_KIND_ANY = 4;
}

message ComparisonV1 {
  bytes typed_key = 1;
  CompareKind kind = 2;
  optional uint64 revision = 3;
  optional bytes digest = 4;
}

enum MutationKind {
  MUTATION_KIND_UNSPECIFIED = 0;
  MUTATION_KIND_PUT = 1;
  MUTATION_KIND_DELETE = 2;
}

message MutationV1 {
  MutationKind kind = 1;
  bytes typed_key = 2;
  optional bytes typed_value = 3;
  optional bytes lease_id = 4;
}

message TxnRequestV1 {
  repeated ComparisonV1 comparisons = 1;
  repeated MutationV1 success = 2;
  repeated MutationV1 failure = 3;
}

message TxnResponseV1 {
  bool comparisons_succeeded = 1;
  uint64 revision = 2;
  repeated bytes typed_results = 3;
}

message WatchRequestV1 {
  bytes typed_prefix = 1;
  uint64 after_revision = 2;
  uint32 maximum_events = 3;
}

message WatchEventV1 {
  uint64 revision = 1;
  repeated MutationV1 changes = 2;
  optional uint64 compaction_floor = 3;
}

message LeaseV1 {
  bytes lease_id = 1;
  uint64 ttl_ms = 2;
  uint64 generation = 3;
}

message PrincipalV1 {
  string provider = 1;
  string principal_id = 2;
  repeated string groups = 3; // sorted
}

message AuthorizationDecisionV1 {
  bytes decision_id = 1;
  bool allowed = 2;
  string action = 3;
  uint64 policy_revision = 4;
  uint64 valid_for_ms = 5;
  repeated NamedValueV1 constraints = 6; // sorted name
}

message PolicyProvenanceV1 {
  string field_path = 1;
  string source = 2; // manifest, deployer, cluster_policy
  optional string decision_id = 3;
}

message DeploymentDeclarationV1 {
  string schema = 1; // gump.declaration/1
  bytes workload_id = 2;
  uint64 generation = 3;
  string namespace = 4;
  string app_id = 5;
  bytes capsule_id = 6;
  bytes capsule_digest = 7;
  ManifestV1 effective_manifest = 8;
  repeated PolicyProvenanceV1 provenance = 9; // sorted field_path
  PrincipalV1 deployer = 10;
  bytes operation_id = 11;
  bytes authorization_decision_id = 12;
  string signer_key_id = 13;
  bytes signature = 14;
}

enum ExecutionState {
  EXECUTION_STATE_UNSPECIFIED = 0;
  EXECUTION_STATE_PENDING = 1;
  EXECUTION_STATE_ADMITTING = 2;
  EXECUTION_STATE_RUNNING = 3;
  EXECUTION_STATE_UNSCHEDULABLE = 4;
  EXECUTION_STATE_CANCELLING = 5;
  EXECUTION_STATE_SUCCEEDED = 6;
  EXECUTION_STATE_FAILED = 7;
  EXECUTION_STATE_CANCELLED = 8;
}

message ExecutionRecordV1 {
  string schema = 1;
  bytes execution_id = 2;
  bytes workload_id = 3;
  uint64 generation = 4;
  ExecutionState state = 5;
  uint64 state_revision = 6;
  optional string reason_code = 7;
  optional bytes external_checkpoint = 8;
}

enum AttemptState {
  ATTEMPT_STATE_UNSPECIFIED = 0;
  ATTEMPT_STATE_CREATED = 1;
  ATTEMPT_STATE_PREPARING = 2;
  ATTEMPT_STATE_ADMITTED = 3;
  ATTEMPT_STATE_STARTING = 4;
  ATTEMPT_STATE_RUNNING = 5;
  ATTEMPT_STATE_STOPPING = 6;
  ATTEMPT_STATE_EXITED = 7;
  ATTEMPT_STATE_CLEANED = 8;
}

message ResourceGrantV1 {
  uint64 cpu_millis = 1;
  uint64 memory_bytes = 2;
  uint64 ephemeral_bytes = 3;
  repeated string device_ids = 4; // sorted
}

message PlacementV1 {
  string schema = 1;
  bytes placement_id = 2;
  bytes execution_id = 3;
  bytes unit_id = 4;
  bytes attempt_id = 5;
  bytes node_id = 6;
  uint32 rank = 7;
  optional string role = 8;
  optional bytes placement_group_id = 9;
  ResourceGrantV1 resources = 10;
  FenceV1 fence = 11;
  bytes lease_id = 12;
}

message AttemptRecordV1 {
  string schema = 1;
  bytes attempt_id = 2;
  bytes placement_id = 3;
  AttemptState state = 4;
  uint64 state_revision = 5;
  optional int32 exit_code = 6;
  optional string reason_code = 7;
}

message AdmissionV1 {
  bytes placement_id = 1;
  bytes attempt_id = 2;
  bool admitted = 3;
  uint64 capability_revision = 4;
  repeated string rejection_reasons = 5;
}

message BarrierV1 {
  bytes placement_group_id = 1;
  uint64 generation = 2;
  repeated bytes required_attempt_ids = 3; // sorted bytes
  repeated bytes admitted_attempt_ids = 4; // sorted bytes
  bool open = 5;
  bytes lease_id = 6;
}

message SecretDeliveryRequestV1 {
  bytes workload_id = 1;
  bytes capsule_id = 2;
  bytes execution_id = 3;
  bytes attempt_id = 4;
  bytes target_node_id = 5;
  repeated string variable_names = 6; // sorted
  FenceV1 fence = 7;
}

message SecretDeliveryV1 {
  string suite = 1;
  bytes delivery_id = 2;
  bytes target_node_id = 3;
  bytes hpke_encapsulated_key = 4;
  bytes ciphertext = 5;
  bytes aad_digest = 6;
  uint64 valid_for_ms = 7;
}

enum ProcessStream {
  PROCESS_STREAM_UNSPECIFIED = 0;
  PROCESS_STREAM_STDOUT = 1;
  PROCESS_STREAM_STDERR = 2;
  PROCESS_STREAM_NATIVE_TOPIC = 3;
}

message TelemetryIdentityV1 {
  bytes cluster_id = 1;
  string namespace = 2;
  string app_id = 3;
  bytes workload_id = 4;
  bytes capsule_id = 5;
  bytes execution_id = 6;
  bytes unit_id = 7;
  optional string role = 8;
  optional uint32 rank = 9;
  bytes attempt_id = 10;
  bytes node_id = 11;
  uint64 agent_incarnation = 12;
}

message TelemetryRecordV1 {
  TelemetryIdentityV1 identity = 1;
  string topic = 2;
  ProcessStream process_stream = 3;
  uint64 local_sequence = 4;
  uint32 chunk_flags = 5;
  bytes payload = 6;
  bool utf8_hint = 7;
  uint64 monotonic_offset_ns = 8;
  int64 received_unix_ms = 9;
}

message TelemetryBatchV1 {
  bytes batch_id = 1;
  repeated TelemetryRecordV1 records = 2;
  uint64 dropped_before = 3;
}

message BulkOpenV1 {
  string kind = 1;
  bytes object_id = 2;
  uint64 total_length = 3;
  uint32 chunk_length = 4;
  bytes final_digest = 5;
}

