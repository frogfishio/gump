---
- hosts: localhost
  gather_facts: false
  vars_files:
    - secrets/rambler-api.vault.yml # use Ansible Vault; gitignore if you prefer envs
  vars:
    nomad_namespace: "{{ namespace | default('default') }}"
    nomad_var_path: "nomad/jobs/rambler-api"
  tasks:
    - name: Push Nomad Variables for rambler-api
      no_log: true
      ansible.builtin.command:
        cmd: >
          nomad var put -namespace={{ nomad_namespace }}
          {{ nomad_var_path }}
          {% for k, v in rambler_api_secrets.items() %} {{ k }}={{ v | quote }}{% endfor %}
      environment:
        NOMAD_ADDR: "{{ lookup('env','NOMAD_ADDR') }}"
        NOMAD_TOKEN: "{{ lookup('env','NOMAD_TOKEN') }}"
