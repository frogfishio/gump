---
# Non-secret host configuration shared by the three disposable nodes.
gump_cluster_port: 7443
gump_workload_port_range: "20000:20999"
gump_runtime_dir: /run/gump
gump_server_state_root: /var/lib/gump

# Supplied by `make configure`:
gump_artifact_path: ""
gump_artifact_sha256: ""
ansible_python_interpreter: /usr/bin/python3
