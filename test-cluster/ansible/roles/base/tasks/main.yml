---
- name: Install small host baseline
  ansible.builtin.apt:
    name:
      - ca-certificates
      - chrony
      - curl
      - fail2ban
      - iproute2
      - jq
      - procps
      - ufw
    update_cache: true
    state: present

- name: Ensure SSH drop-in directory exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    mode: "0755"

- name: Install SSH hardening policy
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/60-gump-test-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      ChallengeResponseAuthentication no
      PermitRootLogin no
      PubkeyAuthentication yes
  notify: Restart SSH

- name: Install fail2ban SSH policy
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/gump-test-ssh.local
    owner: root
    group: root
    mode: "0644"
    content: |
      [sshd]
      enabled = true
      banaction = ufw
      maxretry = 5
      findtime = 10m
      bantime = 1h
  notify: Restart fail2ban

- name: Enable host security services
  ansible.builtin.service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - chrony
    - fail2ban

- name: Disable active swap
  ansible.builtin.command: swapoff -a
  when: ansible_swaptotal_mb | int > 0
  changed_when: true

- name: Remove swap entries from fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^\s*[^#]+\s+\S+\s+swap\s+'
    state: absent

- name: Disable core dumps for the Gump account
  ansible.builtin.copy:
    dest: /etc/security/limits.d/90-gump-no-core.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      gump soft core 0
      gump hard core 0

- name: Set UFW default inbound policy
  ansible.builtin.command: ufw default deny incoming
  changed_when: false

- name: Set UFW default outbound policy
  ansible.builtin.command: ufw default allow outgoing
  changed_when: false

- name: Allow SSH at the host firewall
  ansible.builtin.command: ufw allow OpenSSH
  changed_when: false

- name: Allow private Gump QUIC from cluster peers
  ansible.builtin.command: >-
    ufw allow proto udp from {{ hostvars[item].cluster_private_ip }}
    to any port {{ gump_cluster_port }}
  loop: "{{ groups['gump'] }}"
  changed_when: false

- name: Allow private fixture TCP range from cluster peers
  ansible.builtin.command: >-
    ufw allow proto tcp from {{ hostvars[item].cluster_private_ip }}
    to any port {{ gump_workload_port_range }}
  loop: "{{ groups['gump'] }}"
  changed_when: false

- name: Allow private fixture UDP range from cluster peers
  ansible.builtin.command: >-
    ufw allow proto udp from {{ hostvars[item].cluster_private_ip }}
    to any port {{ gump_workload_port_range }}
  loop: "{{ groups['gump'] }}"
  changed_when: false

- name: Enable UFW
  ansible.builtin.command: ufw --force enable
  changed_when: false

- name: Read installed service inventory
  ansible.builtin.service_facts:

- name: Prohibit old platform services
  ansible.builtin.assert:
    that:
      - (item ~ '.service') not in ansible_facts.services
    fail_msg: "Stale platform service {{ item }} must not be installed on a Gump node."
  loop:
    - nomad
    - consul
    - vault
    - valkey
    - valkey-server
    - caddy

- name: Prohibit durable Gump state directory
  ansible.builtin.stat:
    path: /var/lib/gump
  register: durable_gump_state

- name: Require no durable Gump state directory
  ansible.builtin.assert:
    that:
      - not durable_gump_state.stat.exists
    fail_msg: "/var/lib/gump exists; Gump cluster state must remain memory-only."
