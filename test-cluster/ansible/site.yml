---
- hosts: frogfish
  become: yes
  gather_facts: yes

  pre_tasks:
    - name: Wait for SSH to be ready
      wait_for_connection:
        timeout: 300

    - name: Require an odd-sized cluster of at least three nodes
      assert:
        that:
          - groups['frogfish'] | length >= 3
          - (groups['frogfish'] | length) % 2 == 1
        fail_msg: "frogfish must contain an odd number of nodes and at least 3 hosts"

  tasks:
    - name: Base packages
      apt:
        name:
          - curl
          - dnsutils
          - gnupg
          - ca-certificates
          - lsb-release
          - software-properties-common
          - openssl
          - ufw
          - fail2ban
        update_cache: yes
        state: present

    - name: Ensure sshd drop-in directory exists
      file:
        path: /etc/ssh/sshd_config.d
        state: directory
        mode: "0755"

    - name: Install SSH hardening drop-in
      copy:
        dest: /etc/ssh/sshd_config.d/60-hardening.conf
        owner: root
        group: root
        mode: "0644"
        validate: /usr/sbin/sshd -t -f %s
        content: |
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          ChallengeResponseAuthentication no
          PermitRootLogin no
          PubkeyAuthentication yes
      notify: restart ssh

    - name: Install fail2ban SSH jail override
      copy:
        dest: /etc/fail2ban/jail.d/ssh-hardening.local
        owner: root
        group: root
        mode: "0644"
        content: |
          [sshd]
          enabled = true
          banaction = ufw
          maxretry = 5
          findtime = 10m
          bantime = 1h
      notify: restart fail2ban

    - name: Enable & start fail2ban
      service:
        name: fail2ban
        state: started
        enabled: yes

    - name: Set UFW default incoming policy to deny
      command: ufw default deny incoming
      register: ufw_default_incoming
      changed_when: "'skipping' not in ((ufw_default_incoming.stdout | default('')) ~ (ufw_default_incoming.stderr | default('')) | lower)"

    - name: Set UFW default outgoing policy to allow
      command: ufw default allow outgoing
      register: ufw_default_outgoing
      changed_when: "'skipping' not in ((ufw_default_outgoing.stdout | default('')) ~ (ufw_default_outgoing.stderr | default('')) | lower)"

    - name: Allow SSH through UFW
      command: ufw allow OpenSSH
      register: ufw_allow_ssh
      changed_when: "'skipping' not in ((ufw_allow_ssh.stdout | default('')) ~ (ufw_allow_ssh.stderr | default('')) | lower)"

    - name: Allow HTTP through UFW
      command: ufw allow 80/tcp
      register: ufw_allow_http
      changed_when: "'skipping' not in ((ufw_allow_http.stdout | default('')) ~ (ufw_allow_http.stderr | default('')) | lower)"

    - name: Allow HTTPS through UFW
      command: ufw allow 443/tcp
      register: ufw_allow_https
      changed_when: "'skipping' not in ((ufw_allow_https.stdout | default('')) ~ (ufw_allow_https.stderr | default('')) | lower)"

    - name: Allow cluster control traffic through UFW
      command: ufw allow proto {{ item.1.proto }} from {{ item.0 }} to any port {{ item.1.port }}
      loop: "{{ (groups['frogfish'] | map('extract', hostvars, 'cluster_private_ip') | list) | product(cluster_ufw_rules) | list }}"
      vars:
        cluster_ufw_rules:
          - { port: 8300, proto: tcp }
          - { port: 8301, proto: tcp }
          - { port: 8301, proto: udp }
          - { port: 4647, proto: tcp }
          - { port: 4648, proto: tcp }
          - { port: 4648, proto: udp }
          - { port: 8200, proto: tcp }
          - { port: 8201, proto: tcp }
      register: ufw_cluster_rule
      changed_when: "'skipping' not in ((ufw_cluster_rule.stdout | default('')) ~ (ufw_cluster_rule.stderr | default('')) | lower)"

    - name: Enable UFW
      command: ufw --force enable
      register: ufw_enable
      changed_when: "'already enabled' not in ((ufw_enable.stdout | default('')) ~ (ufw_enable.stderr | default('')) | lower)"

    # ---- Shared HashiCorp APT repo (used by Consul and Nomad) ----
    - name: Ensure deps for key management (HashiCorp)
      apt:
        name: [ca-certificates, gnupg]
        state: present
        update_cache: yes

    - name: Download HashiCorp GPG key (ASCII)
      get_url:
        url: https://apt.releases.hashicorp.com/gpg
        dest: /usr/share/keyrings/hashicorp-archive-keyring.asc
        mode: "0644"

    - name: De-armor HashiCorp key into keyring
      command: >
        gpg --dearmor
        -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
        /usr/share/keyrings/hashicorp-archive-keyring.asc
      args:
        creates: /usr/share/keyrings/hashicorp-archive-keyring.gpg

    - name: Add HashiCorp apt repo
      apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com {{ ansible_facts['lsb']['codename'] }} main"
        filename: hashicorp
        state: present

    # ---- Caddy ----
    - name: Ensure deps for key management (Caddy)
      apt:
        name: [ca-certificates, gnupg]
        state: present
        update_cache: yes

    - name: Download Caddy repo key (ASCII)
      get_url:
        url: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
        dest: /usr/share/keyrings/caddy-stable-archive-keyring.asc
        mode: "0644"

    - name: De-armor Caddy key into keyring
      command: >
        gpg --dearmor
        -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
        /usr/share/keyrings/caddy-stable-archive-keyring.asc
      args:
        creates: /usr/share/keyrings/caddy-stable-archive-keyring.gpg

    - name: Add Caddy repo
      apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/caddy-stable-archive-keyring.gpg] https://dl.cloudsmith.io/public/caddy/stable/deb/debian any-version main"
        filename: caddy-stable
        state: present
      notify: apt update

    - name: Install Caddy
      apt:
        name: caddy
        state: present
        update_cache: yes

    # ---- Valkey ----
    - name: Detect Ubuntu version
      set_fact:
        ubuntu_codename: "{{ ansible_facts['lsb']['codename'] | default('') }}"
        ubuntu_version: "{{ ansible_facts['distribution_version'] | default('') }}"

    - name: Install Valkey (Ubuntu 24.04+)
      apt:
        name: valkey
        state: present
        update_cache: yes
      when: ubuntu_codename == "noble" or ubuntu_version is version('24.04', '>=')

    - name: Install Percona Valkey (Ubuntu 22.04)
      block:
        - apt:
            deb: https://repo.percona.com/apt/percona-release_latest.generic_all.deb
        - command: percona-release enable valkey
        - apt:
            name: valkey
            state: present
            update_cache: yes
      when: ubuntu_codename == "jammy" or ubuntu_version is version('22.04', '==')

    # NEW: ensure the service account exists (package usually creates it, this is safe)
    - name: Ensure valkey user exists
      user:
        name: valkey
        system: yes
        shell: /usr/sbin/nologin
        create_home: no

    - name: Ensure valkey group exists
      group:
        name: valkey
        state: present

    # You can add your app/ops user(s) here if you want socket access:
    - name: Add expected users to valkey group
      user:
        name: "{{ item }}"
        groups: valkey
        append: yes
      loop: [valkey, root]
      ignore_errors: yes

    # UPDATED: let systemd create/manage /run/valkey via RuntimeDirectory, but
    # also ensure it exists now (first start) with correct perms.
    - name: Ensure /run/valkey exists (first boot)
      file:
        path: /run/valkey
        state: directory
        owner: valkey
        group: valkey
        mode: "0770"

    # NEW: data & log dirs where AOF/RDB live; must be writable
    - name: Ensure Valkey data/log dirs
      file:
        path: "{{ item }}"
        state: directory
        owner: valkey
        group: valkey
        mode: "0750"
      loop:
        - /var/lib/valkey
        - /var/lib/valkey/appendonlydir
        - /var/log/valkey

    # Deploy config with explicit dir/appenddirname (prevents the AOF crash)
    - name: Deploy Valkey config
      template:
        src: templates/valkey.conf.j2
        dest: /etc/valkey/valkey.conf
        owner: root
        group: root
        mode: "0644"
      notify: restart valkey

    # NEW: systemd override so the service can write to our paths even if unit uses sandboxing
    - name: Create valkey-server override directory
      file:
        path: /etc/systemd/system/valkey-server.service.d
        state: directory
        mode: "0755"

    - name: Install valkey-server override
      copy:
        dest: /etc/systemd/system/valkey-server.service.d/override.conf
        mode: "0644"
        content: |
          [Service]
          RuntimeDirectory=valkey
          RuntimeDirectoryMode=0755
          ReadWritePaths=/var/lib/valkey /var/log/valkey /run/valkey
      register: valkey_override

    - name: Reload systemd if override changed
      command: systemctl daemon-reload
      when: valkey_override is changed

    # Recommended kernel tuning (removes that recurring warning)
    - name: Enable vm.overcommit_memory
      sysctl:
        name: vm.overcommit_memory
        value: "1"
        state: present
        reload: yes

    # Start service (same as you had, keep the fallback)
    - name: Gather service facts (for fallback check below)
      service_facts:

    - name: Enable & start Valkey
      service:
        name: valkey-server
        enabled: yes
        state: started
      failed_when: false

    - name: Fallback service name (if distro calls it 'valkey')
      service:
        name: valkey
        enabled: yes
        state: started
      when: "'valkey-server.service' not in (ansible_facts.services | default({}))"

    # CLI (redis-tools provides valkey/redis CLI on Ubuntu)
    - name: Install redis-cli for testing
      apt:
        name: redis-tools
        state: present

    # Quick validation (optional)
    - name: Ping Valkey via TCP
      command: "bash -lc 'redis-cli -h 127.0.0.1 -p 6379 -a {{ valkey_pass | quote }} PING'"
      register: ping_out
      changed_when: false
      failed_when: ping_out.rc != 0 or ('PONG' not in ping_out.stdout | default(''))

    # ---- Docker (optional) ----
    - name: Install Docker
      apt:
        name: docker.io
        state: present
      when: install_docker

    - name: Enable Docker
      service:
        name: docker
        state: started
        enabled: yes
      when: install_docker

    # ---- Nomad (optional, now uses shared HashiCorp repo) ----
    - name: Install Nomad
      apt:
        name: nomad
        state: present
        update_cache: yes
      when: install_nomad

    - name: Allow Nomad to access Docker
      user:
        name: nomad
        groups: docker
        append: yes
      when: install_docker and install_nomad
      notify: restart nomad

    - name: Ensure Nomad data dir exists and owned by nomad
      file:
        path: /var/lib/nomad
        state: directory
        owner: nomad
        group: nomad
        mode: "0750"
      when: install_nomad

    - name: Ensure Nomad config dir perms
      file:
        path: /etc/nomad.d
        state: directory
        owner: root
        group: nomad
        mode: "0750"
      when: install_nomad

    - name: Nomad config
      template:
        src: templates/nomad.hcl.j2
        dest: /etc/nomad.d/nomad.hcl
        owner: root
        group: nomad
        mode: "0640"
      when: install_nomad
      notify: restart nomad

    - name: Enable & start Nomad
      service:
        name: nomad
        state: started
        enabled: yes
      when: install_nomad

    # ---- Consul (always) ----
    - name: Install Consul
      apt:
        name: consul
        state: present
        update_cache: yes

    - name: Ensure Consul dirs & ownership
      file:
        path: "{{ item }}"
        state: directory
        owner: consul
        group: consul
        mode: "0750"
      loop:
        - /var/lib/consul
        - /etc/consul.d
        - /etc/consul-prepared-query.d

    - name: Render Consul cluster config
      template:
        src: templates/consul-agent.hcl.j2
        dest: /etc/consul.d/agent.hcl
        owner: consul
        group: consul
        mode: "0640"

    - name: Remove legacy prepared-query payload from Consul config dir
      file:
        path: /etc/consul.d/edge-query-template.json
        state: absent

    - name: Validate Consul config
      command: consul validate /etc/consul.d
      changed_when: false

    # --- systemd override to avoid "activating..." timeouts ---
    - name: Create consul override dir
      file:
        path: /etc/systemd/system/consul.service.d
        state: directory
        mode: "0755"

    # Use Type=simple so systemd doesn't wait for READY notify
    - name: Install systemd override for consul (Type=simple)
      copy:
        dest: /etc/systemd/system/consul.service.d/override.conf
        mode: "0644"
        content: |
          [Service]
          Type=simple
          TimeoutStartSec=0
      register: consul_override

    - name: Reload systemd if override changed
      command: systemctl daemon-reload
      when: consul_override is changed

    # --- start + robust retry if first start fails ---
    - block:
        - name: Enable & start Consul
          service:
            name: consul
            enabled: yes
            state: started

        - name: Wait for Consul HTTP to respond
          uri:
            url: http://127.0.0.1:8500/v1/status/leader
            return_content: yes
          register: consul_http
          retries: 20
          delay: 3
          until: consul_http.status == 200 and (consul_http.content is search('"[0-9.:]+"'))
          changed_when: false

        - name: Show raft peers (debug)
          command: consul operator raft list-peers
          register: raft
          changed_when: false

        - debug:
            var: raft.stdout_lines

      rescue:
        - name: Dump last 120 lines of consul journal
          command: journalctl -u consul -n 120 --no-pager -l
          register: consul_journal
          changed_when: false
          failed_when: false

        - debug:
            var: consul_journal.stdout

        - name: Stop Consul (if running)
          service:
            name: consul
            state: stopped
          failed_when: false

        - name: Purge stale Consul data dir
          file:
            path: /var/lib/consul
            state: absent

        - name: Recreate Consul data dir
          file:
            path: /var/lib/consul
            state: directory
            owner: consul
            group: consul
            mode: "0750"

        - name: Start Consul (retry)
          service:
            name: consul
            enabled: yes
            state: started

        - name: Wait for Consul HTTP (retry)
          uri:
            url: http://127.0.0.1:8500/v1/status/leader
            return_content: yes
          register: consul_http2
          retries: 20
          delay: 3
          until: consul_http2.status == 200 and (consul_http2.content is search('"[0-9.:]+"'))
          changed_when: false

    # ---- Vault (optional, multi-node Raft cluster) ----
    - name: Install Vault
      apt:
        name: vault
        state: present
        update_cache: yes
      when: install_vault

    - name: Ensure Vault config and data dirs exist
      file:
        path: "{{ item.path }}"
        state: directory
        owner: vault
        group: vault
        mode: "{{ item.mode }}"
      loop:
        - { path: "/etc/vault.d", mode: "0750" }
        - { path: "/opt/vault/data", mode: "0750" }
      when: install_vault

    - name: Render Vault cluster config
      template:
        src: templates/vault.hcl.j2
        dest: /etc/vault.d/vault.hcl
        owner: vault
        group: vault
        mode: "0640"
      when: install_vault
      notify: restart vault

    - name: Enable & start Vault
      service:
        name: vault
        state: started
        enabled: yes
      when: install_vault

    - name: Apply pending Vault config restart before bootstrap steps
      meta: flush_handlers
      when: install_vault

    - name: Wait for Vault HTTP health endpoint
      uri:
        url: http://127.0.0.1:8200/v1/sys/health
        status_code: [200, 429, 472, 473, 501, 503]
        return_content: yes
      register: vault_health
      retries: 20
      delay: 3
      until: vault_health.status in [200, 429, 472, 473, 501, 503]
      changed_when: false
      when: install_vault

    - name: Check local Vault init material file
      stat:
        path: "{{ vault_init_file }}"
      delegate_to: localhost
      become: false
      register: vault_init_file_stat
      run_once: true
      when: install_vault

    - name: Refuse to overwrite existing local Vault init material for a new cluster
      fail:
        msg: "Vault is uninitialized on {{ inventory_hostname }}, but local init material already exists at {{ vault_init_file }}. Remove or rotate that file before initializing a new cluster."
      run_once: true
      when:
        - install_vault
        - not (vault_health.json.initialized | default(false) | bool)
        - vault_init_file_stat.stat.exists

    - name: Initialize Vault cluster once from the bootstrap node
      command: vault operator init -format=json
      environment:
        VAULT_ADDR: http://127.0.0.1:8200
      register: vault_init_cmd
      changed_when: true
      no_log: true
      run_once: true
      when:
        - install_vault
        - not (vault_health.json.initialized | default(false) | bool)
        - not vault_init_file_stat.stat.exists

    - name: Persist Vault init material locally
      copy:
        dest: "{{ vault_init_file }}"
        content: "{{ vault_init_cmd.stdout }}\n"
        mode: "0600"
      delegate_to: localhost
      become: false
      no_log: true
      run_once: true
      when:
        - install_vault
        - vault_init_cmd is defined
        - (vault_init_cmd.stdout | default('') | length) > 0

    - name: Record Vault init material from current run
      set_fact:
        vault_init_material: "{{ vault_init_cmd.stdout | from_json }}"
      no_log: true
      run_once: true
      when:
        - install_vault
        - vault_init_cmd is defined
        - (vault_init_cmd.stdout | default('') | length) > 0

    - name: Load Vault init material from local file
      slurp:
        path: "{{ vault_init_file }}"
      delegate_to: localhost
      become: false
      register: vault_init_file_content
      no_log: true
      run_once: true
      when:
        - install_vault
        - vault_init_material is not defined
        - vault_init_file_stat.stat.exists

    - name: Parse Vault init material from local file
      set_fact:
        vault_init_material: "{{ vault_init_file_content.content | b64decode | from_json }}"
      no_log: true
      run_once: true
      when:
        - install_vault
        - vault_init_material is not defined
        - vault_init_file_content is defined

    - name: Read Vault status after init decision
      command: vault status -format=json
      environment:
        VAULT_ADDR: http://127.0.0.1:8200
      register: vault_status_raw
      changed_when: false
      failed_when: false
      when: install_vault

    - name: Parse Vault status after init decision
      set_fact:
        vault_status: "{{ vault_status_raw.stdout | from_json }}"
      when:
        - install_vault
        - (vault_status_raw.stdout | default('') | length) > 0

    - name: Require local Vault init material when nodes need unsealing
      fail:
        msg: "Vault node {{ inventory_hostname }} is sealed, but no local init material was loaded from {{ vault_init_file }}. Set VAULT_INIT_FILE in your local .envrc or restore the file before rerunning Ansible."
      when:
        - install_vault
        - (vault_status.sealed | default(false) | bool)
        - hostvars[groups['frogfish'][0]].vault_init_material is not defined

    - name: Unseal bootstrap Vault node from local operator material
      command: vault operator unseal {{ item }}
      environment:
        VAULT_ADDR: http://127.0.0.1:8200
      loop: "{{ hostvars[groups['frogfish'][0]].vault_init_material.unseal_keys_b64[:vault_unseal_key_count] }}"
      no_log: true
      when:
        - install_vault
        - inventory_hostname == groups['frogfish'][0]
        - (vault_status.sealed | default(false) | bool)
        - hostvars[groups['frogfish'][0]].vault_init_material is defined

    - name: Wait for bootstrap Vault node to become active
      uri:
        url: http://127.0.0.1:8200/v1/sys/health
        status_code: [200]
        return_content: yes
      register: vault_ready
      retries: 20
      delay: 3
      until: vault_ready.status == 200
      changed_when: false
      when:
        - install_vault
        - inventory_hostname == groups['frogfish'][0]

    - name: Wait for bootstrap Vault node to be active from peer nodes
      uri:
        url: http://{{ hostvars[groups['frogfish'][0]]['cluster_private_ip'] }}:8200/v1/sys/health
        status_code: [200]
        return_content: yes
      register: vault_bootstrap_peer_ready
      retries: 20
      delay: 3
      until: vault_bootstrap_peer_ready.status == 200
      changed_when: false
      when:
        - install_vault
        - inventory_hostname != groups['frogfish'][0]

    - name: Refresh Vault status before follower unseal
      command: vault status -format=json
      environment:
        VAULT_ADDR: http://127.0.0.1:8200
      register: vault_status_after_bootstrap_raw
      changed_when: false
      failed_when: false
      when:
        - install_vault
        - inventory_hostname != groups['frogfish'][0]

    - name: Parse Vault status before follower unseal
      set_fact:
        vault_status_after_bootstrap: "{{ vault_status_after_bootstrap_raw.stdout | from_json }}"
      when:
        - install_vault
        - inventory_hostname != groups['frogfish'][0]
        - (vault_status_after_bootstrap_raw.stdout | default('') | length) > 0

    - name: Unseal follower Vault nodes from local operator material
      command: vault operator unseal {{ item }}
      environment:
        VAULT_ADDR: http://127.0.0.1:8200
      loop: "{{ hostvars[groups['frogfish'][0]].vault_init_material.unseal_keys_b64[:vault_unseal_key_count] }}"
      no_log: true
      when:
        - install_vault
        - inventory_hostname != groups['frogfish'][0]
        - (vault_status_after_bootstrap.sealed | default(false) | bool)
        - hostvars[groups['frogfish'][0]].vault_init_material is defined

    - name: Wait for follower Vault nodes to become active or standby after unseal
      uri:
        url: http://127.0.0.1:8200/v1/sys/health
        status_code: [200, 429]
        return_content: yes
      register: vault_follower_ready
      retries: 20
      delay: 3
      until: vault_follower_ready.status in [200, 429]
      changed_when: false
      when:
        - install_vault
        - inventory_hostname != groups['frogfish'][0]

    # ---- OS resolver stub for .consul (so Caddy's A/AAAA lookups succeed) ----
    - name: Ensure systemd-resolved stub for .consul
      block:
        - name: Create resolved.d directory
          file:
            path: /etc/systemd/resolved.conf.d
            state: directory
            mode: "0755"

        - name: Configure .consul domain to use local Consul DNS
          copy:
            dest: /etc/systemd/resolved.conf.d/consul.conf
            mode: "0644"
            content: |
              [Resolve]
              DNS=127.0.0.1:8600
              Domains=~consul
          register: consul_stub

        - name: Restart systemd-resolved if config changed
          service:
            name: systemd-resolved
            state: restarted
          when: consul_stub is changed

        - name: Verify local Consul DNS can answer cluster node records
          command: dig +short @127.0.0.1 -p 8600 {{ inventory_hostname }}.node.consul
          register: consul_resolvectl
          changed_when: false
          failed_when: consul_resolvectl.rc != 0 or (consul_resolvectl.stdout | trim) == ""

    - name: Deploy Consul prepared-query template for generic edge routing
      template:
        src: templates/consul-edge-query-template.json.j2
        dest: /etc/consul-prepared-query.d/edge-query-template.json
        owner: root
        group: consul
        mode: "0640"

    - name: Render Consul prepared-query payload for generic edge routing
      set_fact:
        consul_edge_query_payload: "{{ lookup('template', 'templates/consul-edge-query-template.json.j2') | from_json }}"
      run_once: true
      when: inventory_hostname == groups['frogfish'][0]

    - name: Read existing Consul prepared queries
      uri:
        url: http://127.0.0.1:8500/v1/query
        method: GET
        return_content: true
        status_code: 200
      register: consul_existing_queries
      run_once: true
      when: inventory_hostname == groups['frogfish'][0]

    - name: Select existing generic edge prepared-query id
      set_fact:
        consul_edge_query_id: >-
          {{
            (
              consul_existing_queries.json
              | selectattr('Name', 'equalto', consul_edge_query_payload.Name)
              | selectattr('Template.Type', 'equalto', consul_edge_query_payload.Template.Type)
              | map(attribute='ID')
              | list
              | first
            )
            | default('')
          }}
      run_once: true
      when: inventory_hostname == groups['frogfish'][0]

    - name: Create Consul prepared-query for generic edge routing
      uri:
        url: http://127.0.0.1:8500/v1/query
        method: POST
        body_format: json
        body: "{{ consul_edge_query_payload }}"
        status_code: 200
      changed_when: true
      run_once: true
      when:
        - inventory_hostname == groups['frogfish'][0]
        - consul_edge_query_id == ''

    - name: Update Consul prepared-query for generic edge routing
      uri:
        url: "http://127.0.0.1:8500/v1/query/{{ consul_edge_query_id }}"
        method: PUT
        body_format: json
        body: "{{ consul_edge_query_payload }}"
        status_code: 200
      changed_when: true
      run_once: true
      when:
        - inventory_hostname == groups['frogfish'][0]
        - consul_edge_query_id != ''

    - name: Deploy Caddy Consul ask-helper script
      template:
        src: templates/caddy-consul-ask.py.j2
        dest: /usr/local/lib/caddy-consul-ask.py
        owner: root
        group: root
        mode: "0755"
      notify: restart caddy-consul-ask

    - name: Deploy Caddy Consul ask-helper systemd unit
      template:
        src: templates/caddy-consul-ask.service.j2
        dest: /etc/systemd/system/caddy-consul-ask.service
        owner: root
        group: root
        mode: "0644"
      register: caddy_consul_ask_unit
      notify: restart caddy-consul-ask

    - name: Reload systemd after ask-helper unit changes
      command: systemctl daemon-reload
      when: caddy_consul_ask_unit is changed

    - name: Enable and start Caddy Consul ask-helper
      service:
        name: caddy-consul-ask
        state: started
        enabled: yes

    # ---- Caddyfile (you can keep your existing template) ----
    - name: Deploy Caddyfile
      template:
        src: templates/Caddyfile.j2
        dest: /etc/caddy/Caddyfile
        owner: root
        group: caddy
        mode: "0640"
      notify: reload caddy

    - name: Enable and start Caddy
      service:
        name: caddy
        state: started
        enabled: yes

    # ---- Swap (optional, idempotent) ----
    - name: Check if /swapfile is currently active
      command: bash -lc "swapon --noheadings --show=name | grep -Fx /swapfile"
      register: swap_active
      changed_when: false
      failed_when: false
      when: enable_swap

    - name: Create swapfile if missing
      command: fallocate -l {{ swap_mb }}M /swapfile
      args:
        creates: /swapfile
      when: enable_swap

    - name: Set swap perms
      file:
        path: /swapfile
        mode: "0600"
      when: enable_swap

    - name: Initialize swap area (mkswap) if not already active
      command: mkswap /swapfile
      when: enable_swap and swap_active.rc != 0
      register: mk
      changed_when: mk.rc == 0

    - name: Enable swap if not active
      command: swapon /swapfile
      when: enable_swap and swap_active.rc != 0
      register: sw
      failed_when: false

    - name: Persist swap in fstab (no extra collections needed)
      lineinfile:
        path: /etc/fstab
        regexp: '^\s*/swapfile\s+none\s+swap\s+'
        line: "/swapfile none swap sw 0 0"
        state: present
      when: enable_swap

  handlers:
    - name: apt update
      apt:
        update_cache: yes

    - name: restart valkey
      service:
        name: valkey-server
        state: restarted
      failed_when: false

    - name: restart caddy-consul-ask
      service:
        name: caddy-consul-ask
        state: restarted

    # Validate then reload Caddy (two handlers listening to the same event)
    - name: validate caddyfile
      listen: reload caddy
      command: caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      changed_when: false

    - name: reload caddy service
      listen: reload caddy
      service:
        name: caddy
        state: reloaded

    - name: restart nomad
      service:
        name: nomad
        state: restarted

    - name: restart consul
      service:
        name: consul
        state: restarted

    - name: restart vault
      service:
        name: vault
        state: restarted

    - name: restart ssh
      service:
        name: ssh
        state: restarted

    - name: restart fail2ban
      service:
        name: fail2ban
        state: restarted
