---
- name: Configure three Gump test nodes
  hosts: gump
  become: true
  gather_facts: true

  pre_tasks:
    - name: Wait for SSH and cloud-init
      ansible.builtin.wait_for_connection:
        timeout: 300
      tags: always

    - name: Require exactly three nodes
      ansible.builtin.assert:
        that:
          - groups['gump'] | length == 3
          - groups['gump_seed'] | length == 1
          - groups['gump_joiners'] | length == 2
        fail_msg: "The Gump live harness requires one seed and two joiners."
      run_once: true
      tags: always

  roles:
    - role: base
      tags: base
    - role: gump_host
      tags: gump
