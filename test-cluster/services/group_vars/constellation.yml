constellation_layer3_deploy_mode: nomad-var
constellation_layer3_nomad_namespace: default
constellation_layer3_nomad_addr: http://127.0.0.1:4646
constellation_layer3_consul_http_addr: http://127.0.0.1:8500
constellation_layer3_vault_addr: http://127.0.0.1:8200
constellation_layer3_render_dir: /tmp/frogfish-layer3
constellation_layer3_use_published_images: true

constellation_layer3_install_order:
  - k2db-api
  - k2mx-api
  - k2rbac-api
  - k2login
  - k2hello

constellation_layer3_services:
  k2db-api:
    enabled: true
    job_name: k2db-api
    image_repo: docker.io/frogfishio/k2db-api-server
    image_tag: 20260322061156
    build_tag: 20260322061156
    roll_id: 20260322061156
    domain: "{{ lookup('ansible.builtin.env', 'K2DB_API_DOMAIN') }}"
    system_db_name: k2db
    nomad_var_path: nomad/jobs/k2db-api
    vault_role: k2db-api
    vault_kv_put_path: kv/frogfish/apps/k2db-api
    vault_kv_read_path: kv/data/frogfish/apps/k2db-api
    bootstrap_token: ""
    mongo_uri: "{{ lookup('ansible.builtin.env', 'MONGODB_URI') }}"

  k2rbac-api:
    enabled: true
    job_name: k2rbac-api
    image_repo: docker.io/frogfishio/k2rbac-api-server
    image_tag: latest
    build_tag: latest
    roll_id: latest
    excluded_host: ""
    auth_domain: "{{ lookup('ansible.builtin.env', 'K2RBAC_DOMAIN') }}"
    login_domain: "{{ lookup('ansible.builtin.env', 'K2LOGIN_DOMAIN') }}"
    nomad_var_path: nomad/jobs/k2rbac-api
    vault_role: k2rbac-api
    vault_kv_put_path: kv/frogfish/apps/k2rbac-api
    vault_kv_read_path: kv/data/frogfish/apps/k2rbac-api
    bootstrap_password: ""
    jwt_secret: ""
    k2db_api_key: ""
    k2db_key_name: k2rbac-api
    k2db_key_database: k2rbac
    k2db_key_permissions:
      - collections.read
      - collections.write
    k2mx_api_key: ""

  k2login:
    enabled: true
    job_name: k2login
    image_repo: docker.io/frogfishio/k2login-server
    image_tag: 20260322143907
    build_tag: 20260322143907
    roll_id: 20260322143907
    login_domain: "{{ lookup('ansible.builtin.env', 'K2LOGIN_DOMAIN') }}"
    auth_domain: "{{ lookup('ansible.builtin.env', 'K2RBAC_DOMAIN') }}"
    hello_domain: "{{ lookup('ansible.builtin.env', 'K2HELLO_DOMAIN') }}"
    hello_alt_domain: "{{ lookup('ansible.builtin.env', 'K2HELLO_ALT_DOMAIN') | default(lookup('ansible.builtin.env', 'K2HELLO_DOMAIN'), true) }}"
    nomad_var_path: nomad/jobs/k2login
    vault_role: k2login
    vault_kv_put_path: kv/frogfish/apps/k2login
    vault_kv_read_path: kv/data/frogfish/apps/k2login
    rbac_api_key: ""
    rbac_role: k2login_service
    rbac_owner: system
    rbac_key_name: k2login runtime
    rbac_permissions:
      - auth.token.refresh
      - auth.register
      - auth.password.reset

  k2hello:
    enabled: true
    job_name: k2hello
    image_repo: docker.io/frogfishio/k2hello
    image_tag: 20260322011418-opsui
    build_tag: 20260322011418-opsui
    roll_id: 20260322011418-opsui
    hello_domain: "{{ lookup('ansible.builtin.env', 'K2HELLO_DOMAIN') }}"
    login_domain: "{{ lookup('ansible.builtin.env', 'K2LOGIN_DOMAIN') }}"
    nomad_var_path: nomad/jobs/k2hello
    vault_role: k2hello
    vault_kv_put_path: kv/frogfish/apps/k2hello
    vault_kv_read_path: kv/data/frogfish/apps/k2hello
    session_secret: ""

  k2mx-api:
    enabled: true
    job_name: k2mx-api
    image_repo: docker.io/frogfishio/k2mx-api-server
    image_tag: latest
    build_tag: latest
    roll_id: latest
    nomad_var_path: nomad/jobs/k2mx-api
    vault_role: k2mx-api
    vault_kv_put_path: kv/frogfish/apps/k2mx-api
    vault_kv_read_path: kv/data/frogfish/apps/k2mx-api
    k2db_api_key: ""
    k2db_key_name: k2mx-api
    k2db_key_database: k2mx
    k2db_key_permissions:
      - collections.read
      - collections.write
      - collections.search
      - collections.count
    bootstrap_token: ""
    ui_session_secret: ""
    bootstrap_api_key: ""
    bootstrap_key_id: k2mx-bootstrap
    bootstrap_scope: system
    bootstrap_mailbox_id: bootstrap
    bootstrap_provider_id: bootstrap
    bootstrap_permissions:
      - admin.keys.write
      - admin.providers.write
    bootstrap_key_name: k2mx bootstrap

constellation_layer3_core_init:
  enabled: false
  k2db_action: skip
  reconcile_runtime_config: false
  rbac_bootstrap_admin: false
  k2db_runtime_config:
    api_listen_host: 0.0.0.0
    api_listen_port: 3000
    admin_api_enabled: false
  rbac_first_admin:
    email: admin@example.net
    password: CHANGE_ME_NOW

constellation_layer3_acceptance:
  enabled: true
  wait_retries: 30
  wait_delay: 10