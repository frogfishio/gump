---
- name: Check for local layer 3 secrets pack
  ansible.builtin.stat:
    path: "{{ constellation_layer3_local_secrets_file }}"
  register: constellation_layer3_local_secrets_file_stat
  delegate_to: localhost
  become: false

- name: Read local layer 3 secrets pack
  ansible.builtin.slurp:
    path: "{{ constellation_layer3_local_secrets_file }}"
  register: constellation_layer3_local_secrets_file_raw
  delegate_to: localhost
  become: false
  no_log: true
  when: constellation_layer3_local_secrets_file_stat.stat.exists

- name: Initialize local layer 3 secrets map
  ansible.builtin.set_fact:
    constellation_layer3_local_secrets: >-
      {{
        (
          constellation_layer3_local_secrets_file_raw.content
          | b64decode
          | from_yaml
        )
        if (constellation_layer3_local_secrets_file_stat.stat.exists)
        else {}
      }}
    constellation_layer3_effective_services: "{{ constellation_layer3_services | combine({}, recursive=True, list_merge='replace') }}"
  no_log: true

- name: Generate k2db bootstrap token when missing
  ansible.builtin.set_fact:
    constellation_layer3_generated_k2db_bootstrap_token: "{{ lookup('ansible.builtin.password', '/dev/null', chars=['hexdigits'], length=64) | lower }}"
  when:
    - "'k2db-api' in constellation_layer3_effective_services"
    - constellation_layer3_effective_services['k2db-api'].bootstrap_token | default('') | string | trim | length == 0 or constellation_layer3_effective_services['k2db-api'].bootstrap_token | string | trim == 'CHANGE_ME'
    - constellation_layer3_local_secrets.get('k2db-api', {}).get('bootstrap_token', '') | string | trim | length == 0
  no_log: true

- name: Generate RBAC bootstrap password when missing
  ansible.builtin.set_fact:
    constellation_layer3_generated_rbac_bootstrap_password: "{{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits'], length=32) }}"
  when:
    - "'k2rbac-api' in constellation_layer3_effective_services"
    - constellation_layer3_effective_services['k2rbac-api'].bootstrap_password | default('') | string | trim | length == 0 or constellation_layer3_effective_services['k2rbac-api'].bootstrap_password | string | trim == 'CHANGE_ME'
    - constellation_layer3_local_secrets.get('k2rbac-api', {}).get('bootstrap_password', '') | string | trim | length == 0
  no_log: true

- name: Generate k2mx bootstrap token when missing
  ansible.builtin.set_fact:
    constellation_layer3_generated_k2mx_bootstrap_token: "{{ lookup('ansible.builtin.password', '/dev/null', chars=['hexdigits'], length=64) | lower }}"
  when:
    - "'k2mx-api' in constellation_layer3_effective_services"
    - constellation_layer3_effective_services['k2mx-api'].bootstrap_token | default('') | string | trim | length == 0 or constellation_layer3_effective_services['k2mx-api'].bootstrap_token | string | trim == 'CHANGE_ME'
    - constellation_layer3_local_secrets.get('k2mx-api', {}).get('bootstrap_token', '') | string | trim | length == 0
  no_log: true

- name: Generate k2mx UI session secret when missing
  ansible.builtin.set_fact:
    constellation_layer3_generated_k2mx_ui_session_secret: "{{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits'], length=64) }}"
  when:
    - "'k2mx-api' in constellation_layer3_effective_services"
    - constellation_layer3_effective_services['k2mx-api'].ui_session_secret | default('') | string | trim | length == 0 or constellation_layer3_effective_services['k2mx-api'].ui_session_secret | string | trim == 'CHANGE_ME'
    - constellation_layer3_local_secrets.get('k2mx-api', {}).get('ui_session_secret', '') | string | trim | length == 0
  no_log: true

- name: Generate k2hello session secret when missing
  ansible.builtin.set_fact:
    constellation_layer3_generated_k2hello_session_secret: "{{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits'], length=64) }}"
  when:
    - "'k2hello' in constellation_layer3_effective_services"
    - constellation_layer3_effective_services['k2hello'].session_secret | default('') | string | trim | length == 0 or constellation_layer3_effective_services['k2hello'].session_secret | string | trim == 'CHANGE_ME'
    - constellation_layer3_local_secrets.get('k2hello', {}).get('session_secret', '') | string | trim | length == 0
  no_log: true

- name: Update local secrets map with generated k2db bootstrap token
  ansible.builtin.set_fact:
    constellation_layer3_local_secrets: >-
      {{
        constellation_layer3_local_secrets
        | combine(
            {
              'k2db-api': (
                constellation_layer3_local_secrets.get('k2db-api', {})
                | combine(
                    {
                      'bootstrap_token': constellation_layer3_generated_k2db_bootstrap_token
                    },
                    recursive=True
                  )
              )
            },
            recursive=True,
            list_merge='replace'
          )
      }}
  when: constellation_layer3_generated_k2db_bootstrap_token is defined
  no_log: true

- name: Update local secrets map with generated RBAC bootstrap password
  ansible.builtin.set_fact:
    constellation_layer3_local_secrets: >-
      {{
        constellation_layer3_local_secrets
        | combine(
            {
              'k2rbac-api': (
                constellation_layer3_local_secrets.get('k2rbac-api', {})
                | combine(
                    {
                      'bootstrap_password': constellation_layer3_generated_rbac_bootstrap_password
                    },
                    recursive=True
                  )
              )
            },
            recursive=True,
            list_merge='replace'
          )
      }}
  when: constellation_layer3_generated_rbac_bootstrap_password is defined
  no_log: true

- name: Update local secrets map with generated k2mx bootstrap token
  ansible.builtin.set_fact:
    constellation_layer3_local_secrets: >-
      {{
        constellation_layer3_local_secrets
        | combine(
            {
              'k2mx-api': (
                constellation_layer3_local_secrets.get('k2mx-api', {})
                | combine(
                    {
                      'bootstrap_token': constellation_layer3_generated_k2mx_bootstrap_token
                    },
                    recursive=True
                  )
              )
            },
            recursive=True,
            list_merge='replace'
          )
      }}
  when: constellation_layer3_generated_k2mx_bootstrap_token is defined
  no_log: true

- name: Update local secrets map with generated k2mx UI session secret
  ansible.builtin.set_fact:
    constellation_layer3_local_secrets: >-
      {{
        constellation_layer3_local_secrets
        | combine(
            {
              'k2mx-api': (
                constellation_layer3_local_secrets.get('k2mx-api', {})
                | combine(
                    {
                      'ui_session_secret': constellation_layer3_generated_k2mx_ui_session_secret
                    },
                    recursive=True
                  )
              )
            },
            recursive=True,
            list_merge='replace'
          )
      }}
  when: constellation_layer3_generated_k2mx_ui_session_secret is defined
  no_log: true

- name: Update local secrets map with generated k2hello session secret
  ansible.builtin.set_fact:
    constellation_layer3_local_secrets: >-
      {{
        constellation_layer3_local_secrets
        | combine(
            {
              'k2hello': (
                constellation_layer3_local_secrets.get('k2hello', {})
                | combine(
                    {
                      'session_secret': constellation_layer3_generated_k2hello_session_secret
                    },
                    recursive=True
                  )
              )
            },
            recursive=True,
            list_merge='replace'
          )
      }}
  when: constellation_layer3_generated_k2hello_session_secret is defined
  no_log: true

- name: Persist local secrets pack after bootstrap token generation
  ansible.builtin.copy:
    dest: "{{ constellation_layer3_local_secrets_file }}"
    content: |
      {{ constellation_layer3_local_secrets | to_nice_yaml(indent=2, sort_keys=True) | trim }}
    mode: '0600'
  delegate_to: localhost
  become: false
  when:
    - constellation_layer3_generated_k2db_bootstrap_token is defined or constellation_layer3_generated_rbac_bootstrap_password is defined or constellation_layer3_generated_k2mx_bootstrap_token is defined or constellation_layer3_generated_k2mx_ui_session_secret is defined or constellation_layer3_generated_k2hello_session_secret is defined
  no_log: true

- name: Merge local layer 3 secrets into service config
  ansible.builtin.set_fact:
    constellation_layer3_effective_services: >-
      {{
        constellation_layer3_effective_services
        | combine(
            {
              'k2db-api': constellation_layer3_effective_services['k2db-api']
                | combine(
                    (
                      constellation_layer3_local_secrets.get('k2db-api', {}).get('bootstrap_token', '')
                      | string
                      | trim
                      | length > 0
                    )
                    | ternary(
                        {
                          'bootstrap_token': constellation_layer3_local_secrets.get('k2db-api', {}).get('bootstrap_token', '')
                        },
                        {}
                      ),
                    recursive=True,
                    list_merge='replace'
                  ),
              'k2rbac-api': constellation_layer3_effective_services['k2rbac-api']
                | combine(
                    (
                      constellation_layer3_local_secrets.get('k2rbac-api', {}).get('bootstrap_password', '')
                      | string
                      | trim
                      | length > 0
                    )
                    | ternary(
                        {
                          'bootstrap_password': constellation_layer3_local_secrets.get('k2rbac-api', {}).get('bootstrap_password', '')
                        },
                        {}
                      ),
                    recursive=True,
                    list_merge='replace'
                  )
                | combine(
                    (
                      constellation_layer3_local_secrets.get('k2rbac-api', {}).get('jwt_secret', '')
                      | string
                      | trim
                      | length > 0
                    )
                    | ternary(
                        {
                          'jwt_secret': constellation_layer3_local_secrets.get('k2rbac-api', {}).get('jwt_secret', '')
                        },
                        {}
                      ),
                    recursive=True,
                    list_merge='replace'
                  )
                | combine(
                    (
                      constellation_layer3_local_secrets.get('k2rbac-api', {}).get('k2db_api_key', '')
                      | string
                      | trim
                      | length > 0
                    )
                    | ternary(
                        {
                          'k2db_api_key': constellation_layer3_local_secrets.get('k2rbac-api', {}).get('k2db_api_key', '')
                        },
                        {}
                      ),
                    recursive=True,
                    list_merge='replace'
                  )
                | combine(
                    (
                      (
                        constellation_layer3_local_secrets.get('k2rbac-api', {}).get('k2mx_api_key', '')
                        if (
                          constellation_layer3_local_secrets.get('k2rbac-api', {}).get('k2mx_api_key', '')
                          | string
                          | trim
                          | length > 0
                        )
                        else constellation_layer3_local_secrets.get('k2mx-api', {}).get('bootstrap_api_key', '')
                      )
                      | string
                      | trim
                      | length > 0
                    )
                    | ternary(
                        {
                          'k2mx_api_key': (
                            constellation_layer3_local_secrets.get('k2rbac-api', {}).get('k2mx_api_key', '')
                            if (
                              constellation_layer3_local_secrets.get('k2rbac-api', {}).get('k2mx_api_key', '')
                              | string
                              | trim
                              | length > 0
                            )
                            else constellation_layer3_local_secrets.get('k2mx-api', {}).get('bootstrap_api_key', '')
                          )
                        },
                        {}
                      ),
                    recursive=True,
                    list_merge='replace'
                    ),
                'k2mx-api': constellation_layer3_effective_services['k2mx-api']
                  | combine(
                      (
                        constellation_layer3_local_secrets.get('k2mx-api', {}).get('bootstrap_token', '')
                        | string
                        | trim
                        | length > 0
                      )
                      | ternary(
                          {
                            'bootstrap_token': constellation_layer3_local_secrets.get('k2mx-api', {}).get('bootstrap_token', '')
                          },
                          {}
                        ),
                      recursive=True,
                      list_merge='replace'
                    )
                  | combine(
                      (
                        constellation_layer3_local_secrets.get('k2mx-api', {}).get('ui_session_secret', '')
                        | string
                        | trim
                        | length > 0
                      )
                      | ternary(
                          {
                            'ui_session_secret': constellation_layer3_local_secrets.get('k2mx-api', {}).get('ui_session_secret', '')
                          },
                          {}
                        ),
                      recursive=True,
                      list_merge='replace'
                    )
                  | combine(
                      (
                        constellation_layer3_local_secrets.get('k2mx-api', {}).get('k2db_api_key', '')
                        | string
                        | trim
                        | length > 0
                      )
                      | ternary(
                          {
                            'k2db_api_key': constellation_layer3_local_secrets.get('k2mx-api', {}).get('k2db_api_key', '')
                          },
                          {}
                        ),
                      recursive=True,
                      list_merge='replace'
                    )
                  | combine(
                      (
                        constellation_layer3_local_secrets.get('k2mx-api', {}).get('bootstrap_api_key', '')
                        | string
                        | trim
                        | length > 0
                      )
                      | ternary(
                          {
                            'bootstrap_api_key': constellation_layer3_local_secrets.get('k2mx-api', {}).get('bootstrap_api_key', '')
                          },
                          {}
                        ),
                      recursive=True,
                      list_merge='replace'
                    ),
                'k2login': constellation_layer3_effective_services['k2login']
                  | combine(
                      (
                        constellation_layer3_local_secrets.get('k2login', {}).get('rbac_api_key', '')
                        | string
                        | trim
                        | length > 0
                      )
                      | ternary(
                          {
                            'rbac_api_key': constellation_layer3_local_secrets.get('k2login', {}).get('rbac_api_key', '')
                          },
                          {}
                        ),
                      recursive=True,
                      list_merge='replace'
                  ),
                'k2hello': constellation_layer3_effective_services['k2hello']
                  | combine(
                      (
                        constellation_layer3_local_secrets.get('k2hello', {}).get('session_secret', '')
                        | string
                        | trim
                        | length > 0
                      )
                      | ternary(
                          {
                            'session_secret': constellation_layer3_local_secrets.get('k2hello', {}).get('session_secret', '')
                          },
                          {}
                        ),
                      recursive=True,
                      list_merge='replace'
                  )
            },
            recursive=True,
            list_merge='replace'
          )
      }}
  when:
    - "'k2db-api' in constellation_layer3_effective_services"
    - "'k2rbac-api' in constellation_layer3_effective_services"
    - "'k2mx-api' in constellation_layer3_effective_services"
    - "'k2login' in constellation_layer3_effective_services"
    - "'k2hello' in constellation_layer3_effective_services"
  no_log: true

- name: Mirror persisted k2mx bootstrap API key into RBAC local secrets when missing
  ansible.builtin.set_fact:
    constellation_layer3_mirrored_k2mx_key_into_rbac_local_secrets: true
    constellation_layer3_local_secrets: >-
      {{
        constellation_layer3_local_secrets
        | combine(
            {
              'k2rbac-api': constellation_layer3_local_secrets.get('k2rbac-api', {})
                | combine(
                    {
                      'k2mx_api_key': constellation_layer3_local_secrets.get('k2mx-api', {}).get('bootstrap_api_key', '')
                    },
                    recursive=True,
                    list_merge='replace'
                  )
            },
            recursive=True,
            list_merge='replace'
          )
      }}
  when:
    - constellation_layer3_local_secrets.get('k2rbac-api', {}).get('k2mx_api_key', '') | string | trim | length == 0
    - constellation_layer3_local_secrets.get('k2mx-api', {}).get('bootstrap_api_key', '') | string | trim | length > 0
  no_log: true

- name: Persist local secrets pack after mirroring k2mx bootstrap API key into RBAC
  ansible.builtin.copy:
    dest: "{{ constellation_layer3_local_secrets_file }}"
    content: |
      {{ constellation_layer3_local_secrets | to_nice_yaml(indent=2, sort_keys=True) | trim }}
    mode: '0600'
  delegate_to: localhost
  become: false
  when:
    - constellation_layer3_mirrored_k2mx_key_into_rbac_local_secrets | default(false)
  no_log: true