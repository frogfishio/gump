---
- name: Skip core-init by default
  ansible.builtin.debug:
    msg: Core-init is disabled; set constellation_layer3_core_init.enabled=true and explicit actions to run bootstrap commands.
  when: not (constellation_layer3_core_init.enabled | default(false))

- name: Fetch k2db-api allocations for core-init
  ansible.builtin.command:
    argv:
      - nomad
      - job
      - allocs
      - -json
      - "{{ constellation_layer3_effective_services['k2db-api'].job_name }}"
  register: constellation_layer3_k2db_allocs
  changed_when: false
  environment:
    NOMAD_ADDR: "{{ constellation_layer3_nomad_addr }}"
  when:
    - constellation_layer3_core_init.enabled | default(false)
    - constellation_layer3_effective_services['k2db-api'].enabled | default(false)

- name: Select running k2db-api allocation
  ansible.builtin.set_fact:
    constellation_layer3_k2db_alloc_id: >-
      {{
        (
          constellation_layer3_k2db_allocs.stdout
          | from_json
          | selectattr('ClientStatus', 'equalto', 'running')
          | map(attribute='ID')
          | list
          | first
        )
      }}
  when:
    - constellation_layer3_core_init.enabled | default(false)
    - constellation_layer3_effective_services['k2db-api'].enabled | default(false)

- name: Run explicit k2db control-plane action
  ansible.builtin.command:
    argv:
      - nomad
      - alloc
      - exec
      - -task
      - server
      - "{{ constellation_layer3_k2db_alloc_id }}"
      - k2db-api-server
      - "{{ constellation_layer3_core_init.k2db_action }}"
      - --mongo-uri
      - "{{ constellation_layer3_effective_services['k2db-api'].mongo_uri }}"
      - --bootstrap-token
      - "{{ constellation_layer3_effective_services['k2db-api'].bootstrap_token }}"
      - --system-db-name
      - "{{ constellation_layer3_effective_services['k2db-api'].system_db_name }}"
  register: constellation_layer3_k2db_init_result
  changed_when: true
  environment:
    NOMAD_ADDR: "{{ constellation_layer3_nomad_addr }}"
  no_log: true
  when:
    - constellation_layer3_core_init.enabled | default(false)
    - constellation_layer3_effective_services['k2db-api'].enabled | default(false)
    - constellation_layer3_core_init.k2db_action in ['init', 'recover']

- name: Reconcile k2db runtime config
  ansible.builtin.command:
    argv:
      - nomad
      - alloc
      - exec
      - -task
      - server
      - "{{ constellation_layer3_k2db_alloc_id }}"
      - /bin/sh
      - -lc
      - >-
        export K2DB_MONGO_URI='{{ constellation_layer3_effective_services['k2db-api'].mongo_uri }}'
        K2DB_BOOTSTRAP_TOKEN='{{ constellation_layer3_effective_services['k2db-api'].bootstrap_token }}'
        K2DB_CONFIG_API_LISTEN_HOST='{{ constellation_layer3_core_init.k2db_runtime_config.api_listen_host }}'
        K2DB_CONFIG_API_LISTEN_PORT='{{ constellation_layer3_core_init.k2db_runtime_config.api_listen_port }}'
        K2DB_CONFIG_ADMIN_API_ENABLED='{{ constellation_layer3_core_init.k2db_runtime_config.admin_api_enabled | string | lower }}';
        exec k2db-api-server config set
  changed_when: true
  environment:
    NOMAD_ADDR: "{{ constellation_layer3_nomad_addr }}"
  no_log: true
  when:
    - constellation_layer3_core_init.enabled | default(false)
    - constellation_layer3_effective_services['k2db-api'].enabled | default(false)
    - constellation_layer3_core_init.reconcile_runtime_config | default(false)

- name: Fetch k2rbac-api allocations for core-init
  ansible.builtin.command:
    argv:
      - nomad
      - job
      - allocs
      - -json
      - "{{ constellation_layer3_effective_services['k2rbac-api'].job_name }}"
  register: constellation_layer3_k2rbac_allocs
  changed_when: false
  environment:
    NOMAD_ADDR: "{{ constellation_layer3_nomad_addr }}"
  when:
    - constellation_layer3_core_init.enabled | default(false)
    - constellation_layer3_effective_services['k2rbac-api'].enabled | default(false)
    - constellation_layer3_core_init.rbac_bootstrap_admin | default(false)

- name: Select running k2rbac-api allocation
  ansible.builtin.set_fact:
    constellation_layer3_k2rbac_alloc_id: >-
      {{
        (
          constellation_layer3_k2rbac_allocs.stdout
          | from_json
          | selectattr('ClientStatus', 'equalto', 'running')
          | map(attribute='ID')
          | list
          | first
        )
      }}
  when:
    - constellation_layer3_core_init.enabled | default(false)
    - constellation_layer3_effective_services['k2rbac-api'].enabled | default(false)
    - constellation_layer3_core_init.rbac_bootstrap_admin | default(false)

- name: Bootstrap the first RBAC admin
  ansible.builtin.command:
    argv:
      - nomad
      - alloc
      - exec
      - -task
      - server
      - "{{ constellation_layer3_k2rbac_alloc_id }}"
      - /bin/sh
      - -lc
      - >-
        export RBAC_JWT_SECRET='{{ constellation_layer3_effective_services['k2rbac-api'].jwt_secret }}'
        RBAC_K2DB_BASE_URL='http://k2db-api.service.consul'
        RBAC_K2DB_API_KEY='{{ constellation_layer3_effective_services['k2rbac-api'].k2db_api_key }}'
        RBAC_BOOTSTRAP_PASSWORD='{{ (constellation_layer3_core_init.rbac_first_admin.password if constellation_layer3_core_init.rbac_first_admin.password | default('') | string | trim not in ['', 'CHANGE_ME_NOW'] else constellation_layer3_effective_services['k2rbac-api'].bootstrap_password) }}';
        exec k2rbac-api-server bootstrap-admin --email '{{ constellation_layer3_core_init.rbac_first_admin.email }}'
  changed_when: true
  environment:
    NOMAD_ADDR: "{{ constellation_layer3_nomad_addr }}"
  no_log: true
  when:
    - constellation_layer3_core_init.enabled | default(false)
    - constellation_layer3_effective_services['k2rbac-api'].enabled | default(false)
    - constellation_layer3_core_init.rbac_bootstrap_admin | default(false)