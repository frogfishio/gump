      vault {
      role         = "{{ constellation_layer3_service_cfg.vault_role }}"
      env          = false
      disable_file = true
      change_mode  = "noop"
      }
      {%- endif %}
    constellation_layer3_secret_arg_list: >-
      {{
        [
          'RBAC_JWT_SECRET=' ~ constellation_layer3_service_cfg.jwt_secret,
