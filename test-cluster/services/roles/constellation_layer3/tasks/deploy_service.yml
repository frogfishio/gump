      {% raw %}{{ with secret "{% endraw %}{{ constellation_layer3_service_cfg.vault_kv_read_path }}{% raw %}" }}K2MX_BOOTSTRAP_TOKEN={{ .Data.data.K2MX_BOOTSTRAP_TOKEN }}{{ end }}{% endraw %}
      {%- else -%}
      {% raw %}K2MX_BOOTSTRAP_TOKEN={{ with nomadVar "{% endraw %}{{ constellation_layer3_service_cfg.nomad_var_path }}{% raw %}" }}{{ with .K2MX_BOOTSTRAP_TOKEN }}{{ . }}{{ end }}{{ end }}{% endraw %}
      {%- endif %}
    ui_session_secret_template: >-
      {% if constellation_layer3_deploy_mode == 'vault' -%}
      {% raw %}{{ with secret "{% endraw %}{{ constellation_layer3_service_cfg.vault_kv_read_path }}{% raw %}" }}K2MX_UI_SESSION_SECRET={{ .Data.data.K2MX_UI_SESSION_SECRET }}{{ end }}{% endraw %}
      {%- else -%}
      {% raw %}K2MX_UI_SESSION_SECRET={{ with nomadVar "{% endraw %}{{ constellation_layer3_service_cfg.nomad_var_path }}{% raw %}" }}{{ with .K2MX_UI_SESSION_SECRET }}{{ . }}{{ end }}{{ end }}{% endraw %}
      {%- endif %}
    vault_block: >-
      {% if constellation_layer3_deploy_mode == 'vault' -%}
      vault {
      role         = "{{ constellation_layer3_service_cfg.vault_role }}"
      env          = false
      disable_file = true
      change_mode  = "noop"
      }
      {%- endif %}
    constellation_layer3_secret_arg_list:
      - "K2MX_K2DB_API_KEY={{ constellation_layer3_service_cfg.k2db_api_key }}"
      - "K2MX_BOOTSTRAP_TOKEN={{ constellation_layer3_service_cfg.bootstrap_token }}"
      - "K2MX_UI_SESSION_SECRET={{ constellation_layer3_service_cfg.ui_session_secret }}"
  when: constellation_layer3_service_name == 'k2mx-api'
  no_log: true

- name: Push Nomad variables for current service
  ansible.builtin.command:
    argv: "{{ ['nomad', 'var', 'put', '-force', '-namespace=' ~ constellation_layer3_nomad_namespace, constellation_layer3_service_cfg.nomad_var_path] + constellation_layer3_secret_arg_list }}"
  environment:
    NOMAD_ADDR: "{{ constellation_layer3_nomad_addr }}"
  no_log: true
  when:
    - constellation_layer3_deploy_mode == 'nomad-var'
    - constellation_layer3_secret_arg_list | length > 0

- name: Push Vault secrets for current service
  ansible.builtin.command:
    argv: "{{ ['vault', 'kv', 'put', constellation_layer3_service_cfg.vault_kv_put_path] + constellation_layer3_secret_arg_list }}"
  environment:
    VAULT_ADDR: "{{ constellation_layer3_vault_addr }}"
  no_log: true
  when:
    - constellation_layer3_deploy_mode == 'vault'
    - constellation_layer3_secret_arg_list | length > 0

- name: Render Nomad job for current service
  ansible.builtin.template:
    src: "{{ playbook_dir }}/nomad/templates/{{ constellation_layer3_service_cfg.job_name }}.nomad.tpl"
    dest: "{{ constellation_layer3_render_dir }}/{{ constellation_layer3_service_cfg.job_name }}.nomad.hcl"
    mode: '0644'
    variable_start_string: '[['
    variable_end_string: ']]'

- name: Initialize k2db control-plane state before first runtime start
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - "{{ constellation_layer3_service_cfg.image_repo }}:{{ constellation_layer3_service_cfg.image_tag }}"
      - init
      - --mongo-uri
      - "{{ constellation_layer3_service_cfg.mongo_uri }}"
      - --bootstrap-token
      - "{{ constellation_layer3_service_cfg.bootstrap_token }}"
      - --system-db-name
      - "{{ constellation_layer3_service_cfg.system_db_name }}"
  register: constellation_layer3_k2db_init
  become: true
  changed_when: constellation_layer3_k2db_init.rc == 0
  failed_when: >-
    constellation_layer3_k2db_init.rc != 0 and
    'AlreadyInitialized' not in (
      (constellation_layer3_k2db_init.stdout | default('')) ~
      (constellation_layer3_k2db_init.stderr | default(''))
    )
  when: constellation_layer3_service_name == 'k2db-api'
  no_log: true

- name: Submit Nomad job for current service
  ansible.builtin.command:
    argv:
      - nomad
      - job
      - run
      - -detach
      - "{{ constellation_layer3_render_dir }}/{{ constellation_layer3_service_cfg.job_name }}.nomad.hcl"
  register: constellation_layer3_job_run
  environment:
    NOMAD_ADDR: "{{ constellation_layer3_nomad_addr }}"

- name: Wait for a running allocation for current service
  ansible.builtin.command:
    argv:
      - nomad
      - job
      - allocs
      - -json
      - "{{ constellation_layer3_service_cfg.job_name }}"
  register: constellation_layer3_job_status
  changed_when: false
  environment:
    NOMAD_ADDR: "{{ constellation_layer3_nomad_addr }}"
  until: >-
    (
      (
        constellation_layer3_job_status.stdout
        | from_json
        | selectattr('ClientStatus', 'equalto', 'running')
        | selectattr('DesiredStatus', 'equalto', 'run')
        | list
        | length
      )
      | default(0)
      | int
    ) >= 1
  retries: "{{ constellation_layer3_acceptance.wait_retries }}"
  delay: "{{ constellation_layer3_acceptance.wait_delay }}"

- name: Wait for passing health checks for current service
  ansible.builtin.uri:
    url: "{{ constellation_layer3_consul_http_addr }}/v1/health/service/{{ constellation_layer3_service_cfg.job_name }}?passing=1"
    method: GET
    status_code: 200
    return_content: true
  register: constellation_layer3_current_service_health
  until: constellation_layer3_current_service_health.json | length > 0
  retries: "{{ constellation_layer3_acceptance.wait_retries }}"
  delay: "{{ constellation_layer3_acceptance.wait_delay }}"

- name: Fetch k2mx-api allocations for bootstrap API key derivation
  ansible.builtin.command:
    argv:
      - nomad
      - job
      - allocs
      - -json
      - "{{ constellation_layer3_service_cfg.job_name }}"
  register: constellation_layer3_k2mx_allocs_for_bootstrap_key
  changed_when: false
  environment:
    NOMAD_ADDR: "{{ constellation_layer3_nomad_addr }}"
  when:
    - constellation_layer3_service_name == 'k2mx-api'
    - constellation_layer3_service_cfg.bootstrap_api_key | default('') | string | trim | length == 0 or constellation_layer3_service_cfg.bootstrap_api_key | string | trim == 'CHANGE_ME'
  no_log: true

- name: Select running k2mx-api allocation for bootstrap API key derivation
  ansible.builtin.set_fact:
    constellation_layer3_k2mx_alloc_id_for_bootstrap_key: >-
      {{
        (
          constellation_layer3_k2mx_allocs_for_bootstrap_key.stdout
          | from_json
          | selectattr('ClientStatus', 'equalto', 'running')
          | map(attribute='ID')
          | list
          | first
        )
      }}
  when:
    - constellation_layer3_service_name == 'k2mx-api'
    - constellation_layer3_service_cfg.bootstrap_api_key | default('') | string | trim | length == 0 or constellation_layer3_service_cfg.bootstrap_api_key | string | trim == 'CHANGE_ME'
  no_log: true

- name: Assert a running k2mx-api allocation exists for bootstrap API key derivation
  ansible.builtin.assert:
    that:
      - constellation_layer3_k2mx_alloc_id_for_bootstrap_key | default('') | string | trim | length > 0
    fail_msg: Cannot mint k2mx bootstrap_api_key because no running k2mx-api allocation was found.
  when:
    - constellation_layer3_service_name == 'k2mx-api'
    - constellation_layer3_service_cfg.bootstrap_api_key | default('') | string | trim | length == 0 or constellation_layer3_service_cfg.bootstrap_api_key | string | trim == 'CHANGE_ME'

- name: Mint k2mx bootstrap API key from running k2mx control plane
  ansible.builtin.command:
    argv:
      - nomad
      - alloc
      - exec
      - -task
      - server
      - "{{ constellation_layer3_k2mx_alloc_id_for_bootstrap_key }}"
      - /bin/sh
      - -lc
      - >-
        exec k2mx-api-server bootstrap-api-key
        --json
        --key-id '{{ constellation_layer3_service_cfg.bootstrap_key_id }}'
        --scope '{{ constellation_layer3_service_cfg.bootstrap_scope }}'
        --mailbox-id '{{ constellation_layer3_service_cfg.bootstrap_mailbox_id }}'
        --provider-id '{{ constellation_layer3_service_cfg.bootstrap_provider_id }}'
        --permission '{{ constellation_layer3_service_cfg.bootstrap_permissions[0] }}'
        --permission '{{ constellation_layer3_service_cfg.bootstrap_permissions[1] }}'
        --name '{{ constellation_layer3_service_cfg.bootstrap_key_name | default(constellation_layer3_service_cfg.job_name) }}'
  register: constellation_layer3_k2mx_bootstrap_key_create
  changed_when: constellation_layer3_k2mx_bootstrap_key_create.rc == 0
  environment:
    NOMAD_ADDR: "{{ constellation_layer3_nomad_addr }}"
  when:
    - constellation_layer3_service_name == 'k2mx-api'
    - constellation_layer3_service_cfg.bootstrap_api_key | default('') | string | trim | length == 0 or constellation_layer3_service_cfg.bootstrap_api_key | string | trim == 'CHANGE_ME'
  no_log: true

- name: Resolve derived post-deploy k2mx secret overrides
  ansible.builtin.set_fact:
    constellation_layer3_generated_k2mx_postdeploy_secret_overrides:
      bootstrap_api_key: >-
        {{
          (
            (constellation_layer3_k2mx_bootstrap_key_create.stdout | default('')) ~ '\n' ~ (constellation_layer3_k2mx_bootstrap_key_create.stderr | default(''))
          )
          | regex_findall('"printable"\s*:\s*"([^"]+)"')
          | first
          | default('')
          | replace('\\n', '')
          | replace('\\r', '')
          | trim
        }}
  when:
    - constellation_layer3_service_name == 'k2mx-api'
    - constellation_layer3_service_cfg.bootstrap_api_key | default('') | string | trim | length == 0 or constellation_layer3_service_cfg.bootstrap_api_key | string | trim == 'CHANGE_ME'
  no_log: true

- name: Assert derived post-deploy k2mx bootstrap API key is available
  ansible.builtin.assert:
    that:
      - >-
        constellation_layer3_service_cfg.bootstrap_api_key | default('') | string | trim | length > 0
        or constellation_layer3_generated_k2mx_postdeploy_secret_overrides.bootstrap_api_key | default('') | string | trim | length > 0
    fail_msg: Failed to extract k2mx bootstrap_api_key from k2mx bootstrap-api-key output.
  when: constellation_layer3_service_name == 'k2mx-api'

- name: Merge resolved post-deploy k2mx secrets back into service config
  ansible.builtin.set_fact:
    constellation_layer3_service_cfg: "{{ constellation_layer3_service_cfg | combine(constellation_layer3_generated_k2mx_postdeploy_secret_overrides, recursive=True) }}"
    constellation_layer3_effective_services: >-
      {{
        constellation_layer3_effective_services
        | combine(
            {
              'k2rbac-api': constellation_layer3_effective_services['k2rbac-api'] | combine(
                {
                  'k2mx_api_key': constellation_layer3_generated_k2mx_postdeploy_secret_overrides.bootstrap_api_key
                },
                recursive=True
              ),
              'k2mx-api': constellation_layer3_effective_services['k2mx-api'] | combine(
                constellation_layer3_generated_k2mx_postdeploy_secret_overrides,
                recursive=True
              )
            },
            recursive=True
          )
      }}
  when:
    - constellation_layer3_service_name == 'k2mx-api'
    - constellation_layer3_generated_k2mx_postdeploy_secret_overrides | default({}) | length > 0
  no_log: true

- name: Update local secrets pack with post-deploy k2mx material
  ansible.builtin.set_fact:
    constellation_layer3_local_secrets: >-
      {{
        constellation_layer3_local_secrets
        | default({})
        | combine(
            {
              'k2rbac-api': {}
              | combine(
                  (
                    constellation_layer3_generated_k2mx_postdeploy_secret_overrides.bootstrap_api_key | default('') | string | trim | length > 0
                  )
                  | ternary(
                      {'k2mx_api_key': constellation_layer3_generated_k2mx_postdeploy_secret_overrides.bootstrap_api_key},
                      {}
                    ),
                  recursive=True
                ),
              'k2mx-api': {}
              | combine(
                  (
                    constellation_layer3_service_cfg.bootstrap_token | default('') | string | trim | length > 0
                  )
                  | ternary(
                      {'bootstrap_token': constellation_layer3_service_cfg.bootstrap_token},
                      {}
                    ),
                  recursive=True
                )
              | combine(
                  (
                    constellation_layer3_service_cfg.ui_session_secret | default('') | string | trim | length > 0
                  )
                  | ternary(
                      {'ui_session_secret': constellation_layer3_service_cfg.ui_session_secret},
                      {}
                    ),
                  recursive=True
                )
              | combine(
                  (
                    constellation_layer3_service_cfg.k2db_api_key | default('') | string | trim | length > 0
                  )
                  | ternary(
                      {'k2db_api_key': constellation_layer3_service_cfg.k2db_api_key},
                      {}
                    ),
                  recursive=True
                )
              | combine(
                  (
                    constellation_layer3_service_cfg.bootstrap_api_key | default('') | string | trim | length > 0
                  )
                  | ternary(
                      {'bootstrap_api_key': constellation_layer3_service_cfg.bootstrap_api_key},
                      {}
                    ),
                  recursive=True
                )
            },
            recursive=True,
            list_merge='replace'
          )
      }}
  when:
    - constellation_layer3_service_name == 'k2mx-api'
    - constellation_layer3_generated_k2mx_postdeploy_secret_overrides | default({}) | length > 0
  no_log: true

- name: Persist local secrets pack for post-deploy k2mx material
  ansible.builtin.copy:
    dest: "{{ constellation_layer3_local_secrets_file }}"
    content: |
      {{ constellation_layer3_local_secrets | to_nice_yaml(indent=2, sort_keys=True) | trim }}
    mode: '0600'
  delegate_to: localhost
  become: false
  when:
    - constellation_layer3_service_name == 'k2mx-api'
    - constellation_layer3_generated_k2mx_postdeploy_secret_overrides | default({}) | length > 0
  no_log: true