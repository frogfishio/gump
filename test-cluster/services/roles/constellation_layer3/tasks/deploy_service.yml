    constellation_layer3_secret_arg_list:
      - "K2DB_MONGO_URI={{ constellation_layer3_service_cfg.mongo_uri }}"
      - "K2DB_SYSTEM_DB_NAME={{ constellation_layer3_service_cfg.system_db_name }}"
