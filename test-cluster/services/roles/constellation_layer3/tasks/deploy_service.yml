      {% raw %}K2DB_SYSTEM_DB_NAME={{ with nomadVar "{% endraw %}{{ constellation_layer3_service_cfg.nomad_var_path }}{% raw %}" }}{{ with .K2DB_SYSTEM_DB_NAME }}{{ . }}{{ else }}{% endraw %}{{ constellation_layer3_service_cfg.system_db_name }}{% raw %}{{ end }}{{ else }}{% endraw %}{{ constellation_layer3_service_cfg.system_db_name }}{% raw %}{{ end }}{% endraw %}
      {%- endif %}
    mongo_uri_template: >-
      {% if constellation_layer3_deploy_mode == 'vault' -%}
      {% raw %}{{ with secret "{% endraw %}{{ constellation_layer3_service_cfg.vault_kv_read_path }}{% raw %}" }}K2DB_MONGO_URI={{ .Data.data.K2DB_MONGO_URI }}{{ end }}{% endraw %}
      {%- else -%}
      {% raw %}K2DB_MONGO_URI={{ with nomadVar "{% endraw %}{{ constellation_layer3_service_cfg.nomad_var_path }}{% raw %}" }}{{ with .K2DB_MONGO_URI }}{{ . }}{{ end }}{{ end }}{% endraw %}
