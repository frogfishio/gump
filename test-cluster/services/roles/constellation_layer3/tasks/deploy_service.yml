- name: Build k2mx-api render variables
  ansible.builtin.set_fact:
    k2db_api_key_template: >-
      {% if constellation_layer3_deploy_mode == 'vault' -%}
      {% raw %}{{ with secret "{% endraw %}{{ constellation_layer3_service_cfg.vault_kv_read_path }}{% raw %}" }}K2MX_K2DB_API_KEY={{ .Data.data.K2MX_K2DB_API_KEY }}{{ end }}{% endraw %}
      {%- else -%}
      {% raw %}K2MX_K2DB_API_KEY={{ with nomadVar "{% endraw %}{{ constellation_layer3_service_cfg.nomad_var_path }}{% raw %}" }}{{ with .K2MX_K2DB_API_KEY }}{{ . }}{{ end }}{{ end }}{% endraw %}
