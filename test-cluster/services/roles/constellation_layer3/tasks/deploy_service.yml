---
- name: Load current service config
  ansible.builtin.set_fact:
    constellation_layer3_service_cfg: "{{ constellation_layer3_effective_services[constellation_layer3_service_name] }}"

- name: Generate RBAC JWT secret when missing
  ansible.builtin.set_fact:
    constellation_layer3_generated_rbac_jwt_secret: "{{ lookup('ansible.builtin.password', '/dev/null', chars=['hexdigits'], length=64) | lower }}"
  when:
    - constellation_layer3_service_name == 'k2rbac-api'
    - constellation_layer3_service_cfg.jwt_secret | default('') | string | trim | length == 0 or constellation_layer3_service_cfg.jwt_secret | string | trim == 'CHANGE_ME'
  no_log: true

- name: Fetch k2db-api allocations for RBAC key derivation
  ansible.builtin.command:
    argv:
      - nomad
      - job
      - allocs
      - -json
      - "{{ constellation_layer3_effective_services['k2db-api'].job_name }}"
  register: constellation_layer3_k2db_allocs_for_rbac
  changed_when: false
  environment:
    NOMAD_ADDR: "{{ constellation_layer3_nomad_addr }}"
  when:
    - constellation_layer3_service_name == 'k2rbac-api'
    - constellation_layer3_service_cfg.k2db_api_key | default('') | string | trim | length == 0 or constellation_layer3_service_cfg.k2db_api_key | string | trim == 'CHANGE_ME'
  no_log: true

- name: Select running k2db-api allocation for RBAC key derivation
  ansible.builtin.set_fact:
    constellation_layer3_k2db_alloc_id_for_rbac: >-
      {{
        (
          constellation_layer3_k2db_allocs_for_rbac.stdout
          | from_json
          | selectattr('ClientStatus', 'equalto', 'running')
          | map(attribute='ID')
          | list
          | first
        )
      }}
  when:
    - constellation_layer3_service_name == 'k2rbac-api'
    - constellation_layer3_service_cfg.k2db_api_key | default('') | string | trim | length == 0 or constellation_layer3_service_cfg.k2db_api_key | string | trim == 'CHANGE_ME'
  no_log: true

- name: Assert a running k2db-api allocation exists for RBAC key derivation
  ansible.builtin.assert:
    that:
      - constellation_layer3_k2db_alloc_id_for_rbac | default('') | string | trim | length > 0
    fail_msg: Cannot mint RBAC_K2DB_API_KEY because no running k2db-api allocation was found.
  when:
    - constellation_layer3_service_name == 'k2rbac-api'
    - constellation_layer3_service_cfg.k2db_api_key | default('') | string | trim | length == 0 or constellation_layer3_service_cfg.k2db_api_key | string | trim == 'CHANGE_ME'

- name: Attempt k2db control-plane init with seeded RBAC key
  ansible.builtin.command:
    argv:
      - nomad
      - alloc
      - exec
      - -task
      - server
      - "{{ constellation_layer3_k2db_alloc_id_for_rbac }}"
      - k2db-api-server
      - init
      - --mongo-uri
      - "{{ constellation_layer3_effective_services['k2db-api'].mongo_uri }}"
      - --bootstrap-token
      - "{{ constellation_layer3_effective_services['k2db-api'].bootstrap_token }}"
      - --system-db-name
      - "{{ constellation_layer3_effective_services['k2db-api'].system_db_name }}"
  register: constellation_layer3_k2db_init_for_rbac
  changed_when: constellation_layer3_k2db_init_for_rbac.rc == 0
  failed_when: false
  environment:
    NOMAD_ADDR: "{{ constellation_layer3_nomad_addr }}"
  when:
    - constellation_layer3_service_name == 'k2rbac-api'
    - constellation_layer3_service_cfg.k2db_api_key | default('') | string | trim | length == 0 or constellation_layer3_service_cfg.k2db_api_key | string | trim == 'CHANGE_ME'
  no_log: true

- name: Fail when k2db init for RBAC key derivation fails unexpectedly
  ansible.builtin.fail:
    msg: >-
      Failed to initialize or inspect the k2db control plane while minting RBAC_K2DB_API_KEY.
      This cluster may already be initialized with a different bootstrap token than the one in services/.constellation-secrets.yml.
      Provide the original bootstrap token, recover it from your operator records, or set k2rbac-api.k2db_api_key directly.
  when:
    - constellation_layer3_service_name == 'k2rbac-api'
    - constellation_layer3_service_cfg.k2db_api_key | default('') | string | trim | length == 0 or constellation_layer3_service_cfg.k2db_api_key | string | trim == 'CHANGE_ME'
    - constellation_layer3_k2db_init_for_rbac.rc != 0
    - >-
      not (
        (constellation_layer3_k2db_init_for_rbac.stdout | default('')) ~ '\n' ~ (constellation_layer3_k2db_init_for_rbac.stderr | default(''))
      ) is search('control plane is already initialized|AlreadyInitialized')

- name: Mint RBAC runtime key from initialized k2db control plane
  ansible.builtin.command:
    argv:
      - nomad
      - alloc
      - exec
      - -task
      - server
      - "{{ constellation_layer3_k2db_alloc_id_for_rbac }}"
      - k2db-api-server
      - keys
      - --mongo-uri
      - "{{ constellation_layer3_effective_services['k2db-api'].mongo_uri }}"
      - --bootstrap-token
      - "{{ constellation_layer3_effective_services['k2db-api'].bootstrap_token }}"
      - --system-db-name
      - "{{ constellation_layer3_effective_services['k2db-api'].system_db_name }}"
      - create
      - --name
      - "{{ constellation_layer3_service_cfg.k2db_key_name | default(constellation_layer3_service_cfg.job_name) }}"
      - --database
      - "{{ constellation_layer3_service_cfg.k2db_key_database }}"
      - --permission
      - "{{ constellation_layer3_service_cfg.k2db_key_permissions[0] }}"
      - --permission
      - "{{ constellation_layer3_service_cfg.k2db_key_permissions[1] }}"
  register: constellation_layer3_k2db_key_create_for_rbac
  changed_when: constellation_layer3_k2db_key_create_for_rbac.rc == 0
  failed_when: false
  environment:
    NOMAD_ADDR: "{{ constellation_layer3_nomad_addr }}"
  when:
    - constellation_layer3_service_name == 'k2rbac-api'
    - constellation_layer3_service_cfg.k2db_api_key | default('') | string | trim | length == 0 or constellation_layer3_service_cfg.k2db_api_key | string | trim == 'CHANGE_ME'
    - >-
      constellation_layer3_k2db_init_for_rbac.rc == 0
      or
      (
        ((constellation_layer3_k2db_init_for_rbac.stdout | default('')) ~ '\n' ~ (constellation_layer3_k2db_init_for_rbac.stderr | default('')))
        is search('control plane is already initialized|AlreadyInitialized')
      )
  no_log: true

- name: Fail when RBAC runtime key derivation hits bootstrap-token mismatch
  ansible.builtin.fail:
    msg: >-
      Failed to mint RBAC_K2DB_API_KEY because the running k2db control plane rejected the bootstrap token in services/.constellation-secrets.yml.
      The live cluster is already initialized with a different bootstrap token.
      For this experiment cluster, destroy it and remove local bootstrap artifacts with make clean, then rerun the full bootstrap.
      If you intend to preserve the current cluster instead, you must provide the original bootstrap token or set k2rbac-api.k2db_api_key directly.
  when:
    - constellation_layer3_service_name == 'k2rbac-api'
    - constellation_layer3_service_cfg.k2db_api_key | default('') | string | trim | length == 0 or constellation_layer3_service_cfg.k2db_api_key | string | trim == 'CHANGE_ME'
    - constellation_layer3_k2db_init_for_rbac.rc != 0
    - constellation_layer3_k2db_key_create_for_rbac.rc != 0
    - >-
      (
        (constellation_layer3_k2db_key_create_for_rbac.stdout | default('')) ~ '\n' ~ (constellation_layer3_k2db_key_create_for_rbac.stderr | default(''))
      ) is search('BootstrapVerificationFailed')

- name: Fail when RBAC runtime key derivation fails unexpectedly
  ansible.builtin.fail:
    msg: >-
      Failed to mint RBAC_K2DB_API_KEY from the k2db control plane.
      Inspect the k2db allocation and the live key-creation command for the underlying error.
  when:
    - constellation_layer3_service_name == 'k2rbac-api'
    - constellation_layer3_service_cfg.k2db_api_key | default('') | string | trim | length == 0 or constellation_layer3_service_cfg.k2db_api_key | string | trim == 'CHANGE_ME'
    - constellation_layer3_k2db_init_for_rbac.rc != 0
    - constellation_layer3_k2db_key_create_for_rbac.rc != 0
    - >-
      not (
        (
          (constellation_layer3_k2db_key_create_for_rbac.stdout | default('')) ~ '\n' ~ (constellation_layer3_k2db_key_create_for_rbac.stderr | default(''))
        ) is search('BootstrapVerificationFailed')
      )

- name: Resolve derived RBAC secret overrides
  ansible.builtin.set_fact:
    constellation_layer3_generated_rbac_secret_overrides: >-
      {{
        {}
        | combine(
            (
              constellation_layer3_generated_rbac_jwt_secret is defined
            )
            | ternary(
                {
                  'jwt_secret': constellation_layer3_generated_rbac_jwt_secret
                },
                {}
              ),
            recursive=True
          )
        | combine(
            (
              constellation_layer3_service_cfg.k2db_api_key | default('') | string | trim | length > 0
              and constellation_layer3_service_cfg.k2db_api_key | string | trim != 'CHANGE_ME'
            )
            | ternary(
                {},
                {
                  'k2db_api_key': (
                    (
                      (
                        (constellation_layer3_k2db_key_create_for_rbac.stdout | default('')) ~ '\n' ~ (constellation_layer3_k2db_key_create_for_rbac.stderr | default(''))
                      )
                      is search('runtime key printable:')
                    )
                    | ternary(
                        (
                          (
                            ((((constellation_layer3_k2db_key_create_for_rbac.stdout | default('')) ~ '\n' ~ (constellation_layer3_k2db_key_create_for_rbac.stderr | default('')))
                            .split('runtime key printable:')
                            | last)
                            | regex_findall('([A-Za-z0-9._-]+)')
                            | first)
                            | default('')
                          )
                          | trim
                        ),
                        ''
                      )
                  )
                }
              ),
            recursive=True
          )
      }}
  when: constellation_layer3_service_name == 'k2rbac-api'
  no_log: true

- name: Assert derived RBAC k2db key is available
  ansible.builtin.assert:
    that:
      - >-
        constellation_layer3_service_cfg.k2db_api_key | default('') | string | trim | length > 0
        or constellation_layer3_generated_rbac_secret_overrides.k2db_api_key | default('') | string | trim | length > 0
    fail_msg: Failed to extract RBAC_K2DB_API_KEY from k2db control-plane output.
  when: constellation_layer3_service_name == 'k2rbac-api'

- name: Merge resolved RBAC secrets back into service config
  ansible.builtin.set_fact:
    constellation_layer3_service_cfg: "{{ constellation_layer3_service_cfg | combine(constellation_layer3_generated_rbac_secret_overrides, recursive=True) }}"
    constellation_layer3_effective_services: >-
      {{
        constellation_layer3_effective_services
        | combine(
            {
              'k2rbac-api': constellation_layer3_effective_services['k2rbac-api'] | combine(
                constellation_layer3_generated_rbac_secret_overrides,
                recursive=True
              )
            },
            recursive=True
          )
      }}
  when:
    - constellation_layer3_service_name == 'k2rbac-api'
    - constellation_layer3_generated_rbac_secret_overrides | default({}) | length > 0
  no_log: true

- name: Update local secrets pack with resolved RBAC material
  ansible.builtin.set_fact:
    constellation_layer3_local_secrets: >-
      {{
        constellation_layer3_local_secrets
        | default({})
        | combine(
            {
              'k2db-api': {
                'bootstrap_token': constellation_layer3_effective_services['k2db-api'].bootstrap_token
              },
              'k2rbac-api': {}
              | combine(
                  (
                    constellation_layer3_service_cfg.jwt_secret | default('') | string | trim | length > 0
                  )
                  | ternary(
                      {'jwt_secret': constellation_layer3_service_cfg.jwt_secret},
                      {}
                    ),
                  recursive=True
                )
              | combine(
                  (
                    constellation_layer3_service_cfg.k2db_api_key | default('') | string | trim | length > 0
                  )
                  | ternary(
                      {'k2db_api_key': constellation_layer3_service_cfg.k2db_api_key},
                      {}
                    ),
                  recursive=True
                )
              | combine(
                  (
                    constellation_layer3_service_cfg.k2mx_api_key | default('') | string | trim | length > 0
                  )
                  | ternary(
                      {'k2mx_api_key': constellation_layer3_service_cfg.k2mx_api_key},
                      {}
                    ),
                  recursive=True
                )
            },
            recursive=True,
            list_merge='replace'
          )
      }}
  when:
    - constellation_layer3_service_name == 'k2rbac-api'
    - constellation_layer3_generated_rbac_secret_overrides | default({}) | length > 0
  no_log: true

- name: Persist local secrets pack
  ansible.builtin.copy:
    dest: "{{ constellation_layer3_local_secrets_file }}"
    content: |
      {{ constellation_layer3_local_secrets | to_nice_yaml(indent=2, sort_keys=True) | trim }}
    mode: '0600'
  delegate_to: localhost
  become: false
  when:
    - constellation_layer3_service_name == 'k2rbac-api'
    - constellation_layer3_generated_rbac_secret_overrides | default({}) | length > 0
  no_log: true

- name: Fetch k2rbac-api allocations for k2login key derivation
  ansible.builtin.command:
    argv:
      - nomad
      - job
      - allocs
      - -json
      - "{{ constellation_layer3_effective_services['k2rbac-api'].job_name }}"
  register: constellation_layer3_k2rbac_allocs_for_k2login
  changed_when: false
  environment:
    NOMAD_ADDR: "{{ constellation_layer3_nomad_addr }}"
  when:
    - constellation_layer3_service_name == 'k2login'
    - constellation_layer3_service_cfg.rbac_api_key | default('') | string | trim | length == 0 or constellation_layer3_service_cfg.rbac_api_key | string | trim == 'CHANGE_ME'
  no_log: true

- name: Select running k2rbac-api allocation for k2login key derivation
  ansible.builtin.set_fact:
    constellation_layer3_k2rbac_alloc_id_for_k2login: >-
      {{
        (
          constellation_layer3_k2rbac_allocs_for_k2login.stdout
          | from_json
          | selectattr('ClientStatus', 'equalto', 'running')
          | map(attribute='ID')
          | list
          | first
        )
      }}
  when:
    - constellation_layer3_service_name == 'k2login'
    - constellation_layer3_service_cfg.rbac_api_key | default('') | string | trim | length == 0 or constellation_layer3_service_cfg.rbac_api_key | string | trim == 'CHANGE_ME'
  no_log: true

- name: Assert a running k2rbac-api allocation exists for k2login key derivation
  ansible.builtin.assert:
    that:
      - constellation_layer3_k2rbac_alloc_id_for_k2login | default('') | string | trim | length > 0
    fail_msg: Cannot mint K2LOGIN_RBAC_API_KEY because no running k2rbac-api allocation was found.
  when:
    - constellation_layer3_service_name == 'k2login'
    - constellation_layer3_service_cfg.rbac_api_key | default('') | string | trim | length == 0 or constellation_layer3_service_cfg.rbac_api_key | string | trim == 'CHANGE_ME'

- name: Mint k2login RBAC runtime key from k2rbac control plane
  ansible.builtin.shell: |
    set -eu
    rbac_k2db_base_url="$({
      nomad alloc exec -task server '{{ constellation_layer3_k2rbac_alloc_id_for_k2login }}' \
        /bin/sh -lc 'printf "%s" "$RBAC_K2DB_BASE_URL"'
    } | tr -d '\r')"
    docker run --rm --network host \
      -e RBAC_JWT_SECRET='{{ constellation_layer3_effective_services['k2rbac-api'].jwt_secret }}' \
      -e RBAC_K2DB_BASE_URL="$rbac_k2db_base_url" \
      -e RBAC_K2DB_API_KEY='{{ constellation_layer3_effective_services['k2rbac-api'].k2db_api_key }}' \
      -e RBAC_BOOTSTRAP_PASSWORD='{{ constellation_layer3_effective_services['k2rbac-api'].bootstrap_password }}' \
      '{{ constellation_layer3_effective_services['k2rbac-api'].image_repo }}:{{ constellation_layer3_effective_services['k2rbac-api'].image_tag }}' \
      bootstrap-api-key \
      --json \
      --role '{{ constellation_layer3_service_cfg.rbac_role }}' \
      --permission '{{ constellation_layer3_service_cfg.rbac_permissions[0] }}' \
      --permission '{{ constellation_layer3_service_cfg.rbac_permissions[1] }}' \
      --permission '{{ constellation_layer3_service_cfg.rbac_permissions[2] }}' \
      --owner '{{ constellation_layer3_service_cfg.rbac_owner }}' \
      --name '{{ constellation_layer3_service_cfg.rbac_key_name | default(constellation_layer3_service_cfg.job_name) }}'
  register: constellation_layer3_k2login_rbac_key_create
  changed_when: >-
    constellation_layer3_k2login_rbac_key_create.rc == 0
    or
    (
      (
        (constellation_layer3_k2login_rbac_key_create.stdout | default('')) ~ '\n' ~ (constellation_layer3_k2login_rbac_key_create.stderr | default(''))
      ) is search('"printable"\s*:')
    )
  failed_when: false
  retries: 12
  delay: 5
  until: >-
    constellation_layer3_k2login_rbac_key_create.rc == 0
    or
    (
      (
        (constellation_layer3_k2login_rbac_key_create.stdout | default('')) ~ '\n' ~ (constellation_layer3_k2login_rbac_key_create.stderr | default(''))
      ) is search('"printable"\s*:')
    )
    or
    (
      (
        (constellation_layer3_k2login_rbac_key_create.stdout | default('')) ~ '\n' ~ (constellation_layer3_k2login_rbac_key_create.stderr | default(''))
      ) is search('(?i)BootstrapVerificationFailed|bootstrap password|unauthorized|forbidden')
    )
  environment:
    NOMAD_ADDR: "{{ constellation_layer3_nomad_addr }}"
  when:
    - constellation_layer3_service_name == 'k2login'
    - constellation_layer3_service_cfg.rbac_api_key | default('') | string | trim | length == 0 or constellation_layer3_service_cfg.rbac_api_key | string | trim == 'CHANGE_ME'
  no_log: true
  become: true

- name: Fail when k2login RBAC runtime key mint hits bootstrap-password mismatch
  ansible.builtin.fail:
    msg: >-
      Failed to mint K2LOGIN_RBAC_API_KEY because the running k2rbac control plane rejected the bootstrap password in services/.constellation-secrets.yml.
      The live cluster is already initialized with a different RBAC bootstrap password.
      For this experiment cluster, destroy it and remove local bootstrap artifacts with make clean, then rerun the full bootstrap.
      If you intend to preserve the current cluster instead, you must provide the original bootstrap password or set k2login.rbac_api_key directly.
  when:
    - constellation_layer3_service_name == 'k2login'
    - constellation_layer3_service_cfg.rbac_api_key | default('') | string | trim | length == 0 or constellation_layer3_service_cfg.rbac_api_key | string | trim == 'CHANGE_ME'
    - constellation_layer3_k2login_rbac_key_create.rc != 0
    - >-
      not (
        (
          (constellation_layer3_k2login_rbac_key_create.stdout | default('')) ~ '\n' ~ (constellation_layer3_k2login_rbac_key_create.stderr | default(''))
        ) is search('"printable"\s*:')
      )
    - >-
      (
        (constellation_layer3_k2login_rbac_key_create.stdout | default('')) ~ '\n' ~ (constellation_layer3_k2login_rbac_key_create.stderr | default(''))
      ) is search('(?i)BootstrapVerificationFailed|bootstrap password|unauthorized|forbidden')

- name: Fail when k2login RBAC runtime key mint fails unexpectedly
  ansible.builtin.fail:
    msg: >-
      Failed to mint K2LOGIN_RBAC_API_KEY from the running k2rbac control plane.
      Inspect the k2rbac allocation and rerun the bootstrap-api-key command directly for the underlying error.
  when:
    - constellation_layer3_service_name == 'k2login'
    - constellation_layer3_service_cfg.rbac_api_key | default('') | string | trim | length == 0 or constellation_layer3_service_cfg.rbac_api_key | string | trim == 'CHANGE_ME'
    - constellation_layer3_k2login_rbac_key_create.rc != 0
    - >-
      not (
        (
          (constellation_layer3_k2login_rbac_key_create.stdout | default('')) ~ '\n' ~ (constellation_layer3_k2login_rbac_key_create.stderr | default(''))
        ) is search('"printable"\s*:')
      )
    - >-
      not (
        (
          (constellation_layer3_k2login_rbac_key_create.stdout | default('')) ~ '\n' ~ (constellation_layer3_k2login_rbac_key_create.stderr | default(''))
        ) is search('(?i)BootstrapVerificationFailed|bootstrap password|unauthorized|forbidden')
      )

- name: Resolve derived k2login secret overrides
  ansible.builtin.set_fact:
    constellation_layer3_generated_k2login_secret_overrides:
      rbac_api_key: >-
        {{
          (
            (constellation_layer3_k2login_rbac_key_create.stdout | default('')) ~ '\n' ~ (constellation_layer3_k2login_rbac_key_create.stderr | default(''))
          )
          | regex_findall('"printable"\s*:\s*"([^"]+)"')
          | first
          | default('')
          | replace('\\n', '')
          | replace('\\r', '')
          | trim
        }}
  when:
    - constellation_layer3_service_name == 'k2login'
    - constellation_layer3_service_cfg.rbac_api_key | default('') | string | trim | length == 0 or constellation_layer3_service_cfg.rbac_api_key | string | trim == 'CHANGE_ME'
  no_log: true

- name: Assert derived k2login RBAC key is available
  ansible.builtin.assert:
    that:
      - >-
        constellation_layer3_service_cfg.rbac_api_key | default('') | string | trim | length > 0
        or constellation_layer3_generated_k2login_secret_overrides.rbac_api_key | default('') | string | trim | length > 0
    fail_msg: Failed to extract K2LOGIN_RBAC_API_KEY from k2rbac bootstrap-api-key output.
  when: constellation_layer3_service_name == 'k2login'

- name: Merge resolved k2login secrets back into service config
  ansible.builtin.set_fact:
    constellation_layer3_service_cfg: "{{ constellation_layer3_service_cfg | combine(constellation_layer3_generated_k2login_secret_overrides, recursive=True) }}"
    constellation_layer3_effective_services: >-
      {{
        constellation_layer3_effective_services
        | combine(
            {
              'k2login': constellation_layer3_effective_services['k2login'] | combine(
                constellation_layer3_generated_k2login_secret_overrides,
                recursive=True
              )
            },
            recursive=True
          )
      }}
  when:
    - constellation_layer3_service_name == 'k2login'
    - constellation_layer3_generated_k2login_secret_overrides | default({}) | length > 0
  no_log: true

- name: Update local secrets pack with resolved k2login material
  ansible.builtin.set_fact:
    constellation_layer3_local_secrets: >-
      {{
        constellation_layer3_local_secrets
        | default({})
        | combine(
            {
              'k2login': {}
              | combine(
                  (
                    constellation_layer3_service_cfg.rbac_api_key | default('') | string | trim | length > 0
                  )
                  | ternary(
                      {'rbac_api_key': constellation_layer3_service_cfg.rbac_api_key},
                      {}
                    ),
                  recursive=True
                )
            },
            recursive=True,
            list_merge='replace'
          )
      }}
  when:
    - constellation_layer3_service_name == 'k2login'
    - constellation_layer3_generated_k2login_secret_overrides | default({}) | length > 0
  no_log: true

- name: Persist local secrets pack for k2login material
  ansible.builtin.copy:
    dest: "{{ constellation_layer3_local_secrets_file }}"
    content: |
      {{ constellation_layer3_local_secrets | to_nice_yaml(indent=2, sort_keys=True) | trim }}
    mode: '0600'
  delegate_to: localhost
  become: false
  when:
    - constellation_layer3_service_name == 'k2login'
    - constellation_layer3_generated_k2login_secret_overrides | default({}) | length > 0
  no_log: true

- name: Fetch k2db-api allocations for k2mx key derivation
  ansible.builtin.command:
    argv:
      - nomad
      - job
      - allocs
      - -json
      - "{{ constellation_layer3_effective_services['k2db-api'].job_name }}"
  register: constellation_layer3_k2db_allocs_for_k2mx
  changed_when: false
  environment:
    NOMAD_ADDR: "{{ constellation_layer3_nomad_addr }}"
  when:
    - constellation_layer3_service_name == 'k2mx-api'
    - constellation_layer3_service_cfg.k2db_api_key | default('') | string | trim | length == 0 or constellation_layer3_service_cfg.k2db_api_key | string | trim == 'CHANGE_ME'
  no_log: true

- name: Select running k2db-api allocation for k2mx key derivation
  ansible.builtin.set_fact:
    constellation_layer3_k2db_alloc_id_for_k2mx: >-
      {{
        (
          constellation_layer3_k2db_allocs_for_k2mx.stdout
          | from_json
          | selectattr('ClientStatus', 'equalto', 'running')
          | map(attribute='ID')
          | list
          | first
        )
      }}
  when:
    - constellation_layer3_service_name == 'k2mx-api'
    - constellation_layer3_service_cfg.k2db_api_key | default('') | string | trim | length == 0 or constellation_layer3_service_cfg.k2db_api_key | string | trim == 'CHANGE_ME'
  no_log: true

- name: Assert a running k2db-api allocation exists for k2mx key derivation
  ansible.builtin.assert:
    that:
      - constellation_layer3_k2db_alloc_id_for_k2mx | default('') | string | trim | length > 0
    fail_msg: Cannot mint K2MX_K2DB_API_KEY because no running k2db-api allocation was found.
  when:
    - constellation_layer3_service_name == 'k2mx-api'
    - constellation_layer3_service_cfg.k2db_api_key | default('') | string | trim | length == 0 or constellation_layer3_service_cfg.k2db_api_key | string | trim == 'CHANGE_ME'

- name: Attempt k2db control-plane init with seeded k2mx key
  ansible.builtin.command:
    argv:
      - nomad
      - alloc
      - exec
      - -task
      - server
      - "{{ constellation_layer3_k2db_alloc_id_for_k2mx }}"
      - k2db-api-server
      - init
      - --mongo-uri
      - "{{ constellation_layer3_effective_services['k2db-api'].mongo_uri }}"
      - --bootstrap-token
      - "{{ constellation_layer3_effective_services['k2db-api'].bootstrap_token }}"
      - --system-db-name
      - "{{ constellation_layer3_effective_services['k2db-api'].system_db_name }}"
  register: constellation_layer3_k2db_init_for_k2mx
  changed_when: constellation_layer3_k2db_init_for_k2mx.rc == 0
  failed_when: false
  environment:
    NOMAD_ADDR: "{{ constellation_layer3_nomad_addr }}"
  when:
    - constellation_layer3_service_name == 'k2mx-api'
    - constellation_layer3_service_cfg.k2db_api_key | default('') | string | trim | length == 0 or constellation_layer3_service_cfg.k2db_api_key | string | trim == 'CHANGE_ME'
  no_log: true

- name: Fail when k2db init for k2mx key derivation fails unexpectedly
  ansible.builtin.fail:
    msg: >-
      Failed to initialize or inspect the k2db control plane while minting K2MX_K2DB_API_KEY.
      This cluster may already be initialized with a different bootstrap token than the one in services/.constellation-secrets.yml.
      Provide the original bootstrap token, recover it from your operator records, or set k2mx-api.k2db_api_key directly.
  when:
    - constellation_layer3_service_name == 'k2mx-api'
    - constellation_layer3_service_cfg.k2db_api_key | default('') | string | trim | length == 0 or constellation_layer3_service_cfg.k2db_api_key | string | trim == 'CHANGE_ME'
    - constellation_layer3_k2db_init_for_k2mx.rc != 0
    - >-
      not (
        (constellation_layer3_k2db_init_for_k2mx.stdout | default('')) ~ '\n' ~ (constellation_layer3_k2db_init_for_k2mx.stderr | default(''))
      ) is search('control plane is already initialized|AlreadyInitialized')

- name: Mint k2mx runtime key from initialized k2db control plane
  ansible.builtin.command:
    argv:
      - nomad
      - alloc
      - exec
      - -task
      - server
      - "{{ constellation_layer3_k2db_alloc_id_for_k2mx }}"
      - k2db-api-server
      - keys
      - --mongo-uri
      - "{{ constellation_layer3_effective_services['k2db-api'].mongo_uri }}"
      - --bootstrap-token
      - "{{ constellation_layer3_effective_services['k2db-api'].bootstrap_token }}"
      - --system-db-name
      - "{{ constellation_layer3_effective_services['k2db-api'].system_db_name }}"
      - create
      - --name
      - "{{ constellation_layer3_service_cfg.k2db_key_name | default(constellation_layer3_service_cfg.job_name) }}"
      - --database
      - "{{ constellation_layer3_service_cfg.k2db_key_database }}"
      - --permission
      - "{{ constellation_layer3_service_cfg.k2db_key_permissions[0] }}"
      - --permission
      - "{{ constellation_layer3_service_cfg.k2db_key_permissions[1] }}"
      - --permission
      - "{{ constellation_layer3_service_cfg.k2db_key_permissions[2] }}"
      - --permission
      - "{{ constellation_layer3_service_cfg.k2db_key_permissions[3] }}"
  register: constellation_layer3_k2db_key_create_for_k2mx
  changed_when: constellation_layer3_k2db_key_create_for_k2mx.rc == 0
  failed_when: false
  environment:
    NOMAD_ADDR: "{{ constellation_layer3_nomad_addr }}"
  when:
    - constellation_layer3_service_name == 'k2mx-api'
    - constellation_layer3_service_cfg.k2db_api_key | default('') | string | trim | length == 0 or constellation_layer3_service_cfg.k2db_api_key | string | trim == 'CHANGE_ME'
    - >-
      constellation_layer3_k2db_init_for_k2mx.rc == 0
      or
      (
        ((constellation_layer3_k2db_init_for_k2mx.stdout | default('')) ~ '\n' ~ (constellation_layer3_k2db_init_for_k2mx.stderr | default('')))
        is search('control plane is already initialized|AlreadyInitialized')
      )
  no_log: true

- name: Fail when k2mx runtime key derivation hits bootstrap-token mismatch
  ansible.builtin.fail:
    msg: >-
      Failed to mint K2MX_K2DB_API_KEY because the running k2db control plane rejected the bootstrap token in services/.constellation-secrets.yml.
      The live cluster is already initialized with a different bootstrap token.
      For this experiment cluster, destroy it and remove local bootstrap artifacts with make clean, then rerun the full bootstrap.
      If you intend to preserve the current cluster instead, you must provide the original bootstrap token or set k2mx-api.k2db_api_key directly.
  when:
    - constellation_layer3_service_name == 'k2mx-api'
    - constellation_layer3_service_cfg.k2db_api_key | default('') | string | trim | length == 0 or constellation_layer3_service_cfg.k2db_api_key | string | trim == 'CHANGE_ME'
    - constellation_layer3_k2db_init_for_k2mx.rc != 0
    - constellation_layer3_k2db_key_create_for_k2mx.rc != 0
    - >-
      not (
        (
          (constellation_layer3_k2db_key_create_for_k2mx.stdout | default('')) ~ '\n' ~ (constellation_layer3_k2db_key_create_for_k2mx.stderr | default(''))
        ) is search('runtime key printable:')
      )
    - >-
      (
        (constellation_layer3_k2db_key_create_for_k2mx.stdout | default('')) ~ '\n' ~ (constellation_layer3_k2db_key_create_for_k2mx.stderr | default(''))
      ) is search('BootstrapVerificationFailed')

- name: Fail when k2mx runtime key derivation fails unexpectedly
  ansible.builtin.fail:
    msg: >-
      Failed to mint K2MX_K2DB_API_KEY from the k2db control plane.
      Inspect the k2db allocation and the live key-creation command for the underlying error.
  when:
    - constellation_layer3_service_name == 'k2mx-api'
    - constellation_layer3_service_cfg.k2db_api_key | default('') | string | trim | length == 0 or constellation_layer3_service_cfg.k2db_api_key | string | trim == 'CHANGE_ME'
    - constellation_layer3_k2db_init_for_k2mx.rc != 0
    - constellation_layer3_k2db_key_create_for_k2mx.rc != 0
    - >-
      not (
        (
          (constellation_layer3_k2db_key_create_for_k2mx.stdout | default('')) ~ '\n' ~ (constellation_layer3_k2db_key_create_for_k2mx.stderr | default(''))
        ) is search('runtime key printable:')
      )
    - >-
      not (
        (
          (constellation_layer3_k2db_key_create_for_k2mx.stdout | default('')) ~ '\n' ~ (constellation_layer3_k2db_key_create_for_k2mx.stderr | default(''))
        ) is search('BootstrapVerificationFailed')
      )

- name: Resolve derived k2mx secret overrides
  ansible.builtin.set_fact:
    constellation_layer3_generated_k2mx_secret_overrides: >-
      {{
        {}
        | combine(
            (
              constellation_layer3_service_cfg.k2db_api_key | default('') | string | trim | length > 0
              and constellation_layer3_service_cfg.k2db_api_key | string | trim != 'CHANGE_ME'
            )
            | ternary(
                {},
                {
                  'k2db_api_key': (
                    (
                      (
                        (constellation_layer3_k2db_key_create_for_k2mx.stdout | default('')) ~ '\n' ~ (constellation_layer3_k2db_key_create_for_k2mx.stderr | default(''))
                      )
                      is search('runtime key printable:')
                    )
                    | ternary(
                        (
                          (
                            ((((constellation_layer3_k2db_key_create_for_k2mx.stdout | default('')) ~ '\n' ~ (constellation_layer3_k2db_key_create_for_k2mx.stderr | default('')))
                            .split('runtime key printable:')
                            | last)
                            | regex_findall('([A-Za-z0-9._-]+)')
                            | first)
                            | default('')
                          )
                          | trim
                        ),
                        ''
                      )
                  )
                }
              ),
            recursive=True
          )
      }}
  when: constellation_layer3_service_name == 'k2mx-api'
  no_log: true

- name: Assert derived k2mx k2db key is available
  ansible.builtin.assert:
    that:
      - >-
        constellation_layer3_service_cfg.k2db_api_key | default('') | string | trim | length > 0
        or constellation_layer3_generated_k2mx_secret_overrides.k2db_api_key | default('') | string | trim | length > 0
    fail_msg: Failed to extract K2MX_K2DB_API_KEY from k2db control-plane output.
  when: constellation_layer3_service_name == 'k2mx-api'

- name: Merge resolved k2mx secrets back into service config
  ansible.builtin.set_fact:
    constellation_layer3_service_cfg: "{{ constellation_layer3_service_cfg | combine(constellation_layer3_generated_k2mx_secret_overrides, recursive=True) }}"
    constellation_layer3_effective_services: >-
      {{
        constellation_layer3_effective_services
        | combine(
            {
              'k2mx-api': constellation_layer3_effective_services['k2mx-api'] | combine(
                constellation_layer3_generated_k2mx_secret_overrides,
                recursive=True
              )
            },
            recursive=True
          )
      }}
  when:
    - constellation_layer3_service_name == 'k2mx-api'
    - constellation_layer3_generated_k2mx_secret_overrides | default({}) | length > 0
  no_log: true

- name: Update local secrets pack with resolved k2mx material
  ansible.builtin.set_fact:
    constellation_layer3_local_secrets: >-
      {{
        constellation_layer3_local_secrets
        | default({})
        | combine(
            {
              'k2mx-api': {}
              | combine(
                  (
                    constellation_layer3_service_cfg.bootstrap_token | default('') | string | trim | length > 0
                  )
                  | ternary(
                      {'bootstrap_token': constellation_layer3_service_cfg.bootstrap_token},
                      {}
                    ),
                  recursive=True
                )
              | combine(
                  (
                    constellation_layer3_service_cfg.ui_session_secret | default('') | string | trim | length > 0
                  )
                  | ternary(
                      {'ui_session_secret': constellation_layer3_service_cfg.ui_session_secret},
                      {}
                    ),
                  recursive=True
                )
              | combine(
                  (
                    constellation_layer3_service_cfg.k2db_api_key | default('') | string | trim | length > 0
                  )
                  | ternary(
                      {'k2db_api_key': constellation_layer3_service_cfg.k2db_api_key},
                      {}
                    ),
                  recursive=True
                )
            },
            recursive=True,
            list_merge='replace'
          )
      }}
  when:
    - constellation_layer3_service_name == 'k2mx-api'
    - constellation_layer3_generated_k2mx_secret_overrides | default({}) | length > 0
  no_log: true

- name: Persist local secrets pack for k2mx material
  ansible.builtin.copy:
    dest: "{{ constellation_layer3_local_secrets_file }}"
    content: |
      {{ constellation_layer3_local_secrets | to_nice_yaml(indent=2, sort_keys=True) | trim }}
    mode: '0600'
  delegate_to: localhost
  become: false
  when:
    - constellation_layer3_service_name == 'k2mx-api'
    - constellation_layer3_generated_k2mx_secret_overrides | default({}) | length > 0
  no_log: true

- name: Reset service-specific render variables
  ansible.builtin.set_fact:
    job_name: "{{ constellation_layer3_service_cfg.job_name }}"
