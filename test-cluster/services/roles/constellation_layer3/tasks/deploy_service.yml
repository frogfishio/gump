      {%- else -%}
      {% raw %}RBAC_K2MX_API_KEY={{ with nomadVar "{% endraw %}{{ constellation_layer3_service_cfg.nomad_var_path }}{% raw %}" }}{{ with .RBAC_K2MX_API_KEY }}{{ . }}{{ end }}{{ end }}{% endraw %}
      {%- endif %}
