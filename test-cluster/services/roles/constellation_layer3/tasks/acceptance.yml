---
- name: Wait for passing Consul checks for deployed services
  ansible.builtin.uri:
    url: "{{ constellation_layer3_consul_http_addr }}/v1/health/service/{{ item }}?passing=1"
    method: GET
    status_code: 200
    return_content: true
  register: constellation_layer3_service_health
  until: constellation_layer3_service_health.json | length > 0
  retries: "{{ constellation_layer3_acceptance.wait_retries }}"
  delay: "{{ constellation_layer3_acceptance.wait_delay }}"
  loop: "{{ constellation_layer3_deploy_services }}"
  when: constellation_layer3_acceptance.enabled | default(true)