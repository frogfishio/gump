- name: Assert deploy mode is supported
  ansible.builtin.assert:
    that:
      - constellation_layer3_deploy_mode in ['nomad-var', 'vault']
    fail_msg: constellation_layer3_deploy_mode must be nomad-var or vault.

- name: Assert service map exists
  ansible.builtin.assert:
    that:
      - constellation_layer3_effective_services is mapping
      - constellation_layer3_effective_services | length > 0
    fail_msg: constellation_layer3_effective_services must define at least the core services.

- name: Assert required core services are present
  ansible.builtin.assert:
    that:
      - "'k2db-api' in constellation_layer3_effective_services"
      - "'k2rbac-api' in constellation_layer3_effective_services"
      - "'k2login' in constellation_layer3_effective_services"
      - "'k2hello' in constellation_layer3_effective_services"
    fail_msg: k2db-api, k2rbac-api, k2login, and k2hello must be defined.

- name: Assert enabled services have common required fields
  ansible.builtin.assert:
    that:
      - item.value.job_name is defined
      - item.value.image_repo is defined
      - item.value.image_tag is defined
      - item.value.image_tag | string | trim | length > 0
      - item.value.build_tag is defined
      - item.value.build_tag | string | trim | length > 0
      - item.value.roll_id is defined
      - item.value.roll_id | string | trim | length > 0
    fail_msg: "Service {{ item.key }} is missing one or more common required fields."
  loop: "{{ constellation_layer3_effective_services | dict2items }}"
  when: item.value.enabled | default(false)

- name: Assert enabled services have a matching Nomad template
  ansible.builtin.assert:
    that:
      - query('fileglob', playbook_dir + '/nomad/templates/' + item.value.job_name + '.nomad.tpl') | length == 1
    fail_msg: "Missing Nomad template for enabled service {{ item.key }} at services/nomad/templates/{{ item.value.job_name }}.nomad.tpl."
  loop: "{{ constellation_layer3_effective_services | dict2items }}"
  when: item.value.enabled | default(false)

- name: Assert k2db-api required fields
  ansible.builtin.assert:
    that:
      - constellation_layer3_effective_services['k2db-api'].domain is defined
      - constellation_layer3_effective_services['k2db-api'].domain | string | trim | length > 0
      - constellation_layer3_effective_services['k2db-api'].system_db_name is defined
      - constellation_layer3_effective_services['k2db-api'].mongo_uri is defined
      - constellation_layer3_effective_services['k2db-api'].mongo_uri | string | trim | length > 0
      - constellation_layer3_effective_services['k2db-api'].nomad_var_path is defined or constellation_layer3_deploy_mode == 'vault'
    fail_msg: k2db-api requires domain, system_db_name, mongo_uri, and a nomad_var_path for nomad-var deploys.
  when: constellation_layer3_effective_services['k2db-api'].enabled | default(false)

- name: Assert k2rbac-api required fields
  ansible.builtin.assert:
    that:
      - constellation_layer3_effective_services['k2rbac-api'].auth_domain is defined
      - constellation_layer3_effective_services['k2rbac-api'].auth_domain | string | trim | length > 0
      - >-
        (
          constellation_layer3_effective_services['k2rbac-api'].k2mx_api_key | default('') | string | trim | length == 0
        )
        or
        (
          constellation_layer3_effective_services['k2rbac-api'].login_domain is defined
          and constellation_layer3_effective_services['k2rbac-api'].login_domain | string | trim | length > 0
        )
      - >-
        (
          constellation_layer3_effective_services['k2rbac-api'].k2db_api_key | default('') | string | trim | length > 0
        )
        and
        (
          constellation_layer3_effective_services['k2rbac-api'].k2db_api_key | default('') | string | trim != 'CHANGE_ME'
        )
        or
        (
          constellation_layer3_effective_services['k2db-api'].bootstrap_token | default('') | string | trim | length > 0
        )
        and
        (
          constellation_layer3_effective_services['k2db-api'].bootstrap_token | default('') | string | trim != 'CHANGE_ME'
        )
        and
        (
          constellation_layer3_effective_services['k2rbac-api'].k2db_key_database is defined
        )
        and
        (
          constellation_layer3_effective_services['k2rbac-api'].k2db_key_database | string | trim | length > 0
        )
        and
        (
          constellation_layer3_effective_services['k2rbac-api'].k2db_key_permissions is defined
        )
        and
        (
          constellation_layer3_effective_services['k2rbac-api'].k2db_key_permissions | length > 0
        )
      - constellation_layer3_effective_services['k2rbac-api'].nomad_var_path is defined or constellation_layer3_deploy_mode == 'vault'
    fail_msg: k2rbac-api requires auth_domain, and when mail-plane integration is enabled it also requires login_domain, plus a nomad_var_path for nomad-var deploys. It also needs either a direct k2db_api_key or enough k2db control-plane input to mint one (k2db bootstrap_token, k2db_key_database, k2db_key_permissions).
  when: constellation_layer3_effective_services['k2rbac-api'].enabled | default(false)

- name: Assert k2login required fields
  ansible.builtin.assert:
    that:
      - constellation_layer3_effective_services['k2login'].login_domain is defined
      - constellation_layer3_effective_services['k2login'].login_domain | string | trim | length > 0
      - constellation_layer3_effective_services['k2login'].auth_domain is defined
      - constellation_layer3_effective_services['k2login'].auth_domain | string | trim | length > 0
      - constellation_layer3_effective_services['k2login'].hello_domain is defined
      - constellation_layer3_effective_services['k2login'].hello_domain | string | trim | length > 0
      - constellation_layer3_effective_services['k2login'].hello_alt_domain is defined
      - constellation_layer3_effective_services['k2login'].hello_alt_domain | string | trim | length > 0
      - >-
        (
          constellation_layer3_effective_services['k2login'].rbac_api_key | default('') | string | trim | length > 0
        )
        and
        (
          constellation_layer3_effective_services['k2login'].rbac_api_key | default('') | string | trim != 'CHANGE_ME'
        )
        or
        (
          constellation_layer3_effective_services['k2rbac-api'].bootstrap_password | default('') | string | trim | length > 0
        )
        and
        (
          constellation_layer3_effective_services['k2rbac-api'].bootstrap_password | default('') | string | trim != 'CHANGE_ME'
        )
        and
        (
          constellation_layer3_effective_services['k2login'].rbac_role is defined
        )
        and
        (
          constellation_layer3_effective_services['k2login'].rbac_role | string | trim | length > 0
        )
        and
        (
          constellation_layer3_effective_services['k2login'].rbac_owner is defined
        )
        and
        (
          constellation_layer3_effective_services['k2login'].rbac_owner | string | trim | length > 0
        )
        and
        (
          constellation_layer3_effective_services['k2login'].rbac_permissions is defined
        )
        and
        (
          constellation_layer3_effective_services['k2login'].rbac_permissions | length > 0
        )
      - constellation_layer3_effective_services['k2login'].nomad_var_path is defined or constellation_layer3_deploy_mode == 'vault'
    fail_msg: k2login requires login_domain, auth_domain, hello_domain, hello_alt_domain, and a nomad_var_path for nomad-var deploys. It also needs either a direct rbac_api_key or enough RBAC bootstrap input to mint one later in the run (k2rbac bootstrap_password, rbac_role, rbac_owner, rbac_permissions).
  when: constellation_layer3_effective_services['k2login'].enabled | default(false)

- name: Assert k2hello required fields
  ansible.builtin.assert:
    that:
      - constellation_layer3_effective_services['k2hello'].hello_domain is defined
      - constellation_layer3_effective_services['k2hello'].hello_domain | string | trim | length > 0
      - constellation_layer3_effective_services['k2hello'].login_domain is defined
      - constellation_layer3_effective_services['k2hello'].login_domain | string | trim | length > 0
      - constellation_layer3_effective_services['k2hello'].session_secret | default('') | string | trim | length > 0
      - constellation_layer3_effective_services['k2hello'].session_secret | default('') | string | trim != 'CHANGE_ME'
      - constellation_layer3_effective_services['k2hello'].nomad_var_path is defined or constellation_layer3_deploy_mode == 'vault'
    fail_msg: k2hello requires hello_domain, login_domain, session_secret, and a nomad_var_path for nomad-var deploys.
  when: constellation_layer3_effective_services['k2hello'].enabled | default(false)

- name: Assert k2db bootstrap token is present when core-init needs it
  ansible.builtin.assert:
    that:
      - constellation_layer3_effective_services['k2db-api'].bootstrap_token is defined
    fail_msg: k2db-api bootstrap_token is required when core-init init, recover, or config reconciliation is enabled.
  when:
    - constellation_layer3_core_init.enabled | default(false)
    - constellation_layer3_effective_services['k2db-api'].enabled | default(false)
    - constellation_layer3_core_init.k2db_action in ['init', 'recover'] or constellation_layer3_core_init.reconcile_runtime_config | default(false)

- name: Assert k2mx-api required fields
  ansible.builtin.assert:
    that:
      - >-
        (
          constellation_layer3_effective_services['k2mx-api'].k2db_api_key | default('') | string | trim | length > 0
        )
        and
        (
          constellation_layer3_effective_services['k2mx-api'].k2db_api_key | default('') | string | trim != 'CHANGE_ME'
        )
        or
        (
          constellation_layer3_effective_services['k2db-api'].bootstrap_token | default('') | string | trim | length > 0
        )
        and
        (
          constellation_layer3_effective_services['k2db-api'].bootstrap_token | default('') | string | trim != 'CHANGE_ME'
        )
        and
        (
          constellation_layer3_effective_services['k2mx-api'].k2db_key_database is defined
        )
        and
        (
          constellation_layer3_effective_services['k2mx-api'].k2db_key_database | string | trim | length > 0
        )
        and
        (
          constellation_layer3_effective_services['k2mx-api'].k2db_key_permissions is defined
        )
        and
        (
          constellation_layer3_effective_services['k2mx-api'].k2db_key_permissions | length > 3
        )
      - constellation_layer3_effective_services['k2mx-api'].bootstrap_token | default('') | string | trim | length > 0
      - constellation_layer3_effective_services['k2mx-api'].bootstrap_token | default('') | string | trim != 'CHANGE_ME'
      - constellation_layer3_effective_services['k2mx-api'].ui_session_secret | default('') | string | trim | length > 0
      - constellation_layer3_effective_services['k2mx-api'].ui_session_secret | default('') | string | trim != 'CHANGE_ME'
      - >-
        (
          constellation_layer3_effective_services['k2mx-api'].bootstrap_api_key | default('') | string | trim | length > 0
        )
        and
        (
          constellation_layer3_effective_services['k2mx-api'].bootstrap_api_key | default('') | string | trim != 'CHANGE_ME'
        )
        or
        (
          constellation_layer3_effective_services['k2mx-api'].bootstrap_key_id is defined
        )
        and
        (
          constellation_layer3_effective_services['k2mx-api'].bootstrap_key_id | string | trim | length > 0
        )
        and
        (
          constellation_layer3_effective_services['k2mx-api'].bootstrap_scope is defined
        )
        and
        (
          constellation_layer3_effective_services['k2mx-api'].bootstrap_scope | string | trim | length > 0
        )
        and
        (
          constellation_layer3_effective_services['k2mx-api'].bootstrap_mailbox_id is defined
        )
        and
        (
          constellation_layer3_effective_services['k2mx-api'].bootstrap_mailbox_id | string | trim | length > 0
        )
        and
        (
          constellation_layer3_effective_services['k2mx-api'].bootstrap_provider_id is defined
        )
        and
        (
          constellation_layer3_effective_services['k2mx-api'].bootstrap_provider_id | string | trim | length > 0
        )
        and
        (
          constellation_layer3_effective_services['k2mx-api'].bootstrap_permissions is defined
        )
        and
        (
          constellation_layer3_effective_services['k2mx-api'].bootstrap_permissions | length > 1
        )
      - constellation_layer3_effective_services['k2mx-api'].nomad_var_path is defined or constellation_layer3_deploy_mode == 'vault'
    fail_msg: k2mx-api requires bootstrap_token, ui_session_secret, and a nomad_var_path for nomad-var deploys. It also needs either a direct k2db_api_key or enough k2db control-plane input to mint one (k2db bootstrap_token, k2db_key_database, k2db_key_permissions), plus either a direct bootstrap_api_key or enough bootstrap-api-key input to mint one after deploy (bootstrap_key_id, bootstrap_scope, bootstrap_mailbox_id, bootstrap_provider_id, bootstrap_permissions).
  when: constellation_layer3_effective_services['k2mx-api'].enabled | default(false)

- name: Assert vault-mode services define read and write paths
  ansible.builtin.assert:
    that:
      - item.value.vault_kv_put_path is defined
      - item.value.vault_kv_read_path is defined
      - item.value.vault_role is defined
    fail_msg: "Service {{ item.key }} must define vault_kv_put_path, vault_kv_read_path, and vault_role when deploy_mode=vault."
  loop: "{{ constellation_layer3_effective_services | dict2items }}"
  when:
    - constellation_layer3_deploy_mode == 'vault'
    - item.value.enabled | default(false)