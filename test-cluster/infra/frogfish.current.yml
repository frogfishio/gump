# Current frogfish baseline derived from the repo's deploy-script defaults and
# service documentation.
#
# Use this as the real starting point for infra integration.
# Replace secrets, image tags, and any cluster-specific paths that differ in
# the target environment.
#
# Current image tags below come from docs/stage2-cluster-reset-inventory.md
# where the repo pins the last verified live cluster tags.
#
# k2hello is the exception: the repo currently does not pin one verified live
# hello image tag in the same inventory, so infra must fill that value from the
# live cluster or release record.
#
# Bootstrap-token rule:
# - K2DB bootstrap token is a control-plane unlock secret, not a normal runtime
#   task env var. It should normally come from Vault or another infra-owned
#   secret source and be supplied only to init/recover/config-set style actions.
# - K2MX bootstrap token is the service's documented bootstrap secret and its
#   Vault path is already documented below.
#
# Nomad-var-path rule:
# - Current deploy scripts write job-scoped Nomad vars under `nomad/jobs/<job>`.
# - That is why the service entries below use paths like `nomad/jobs/k2login`.

constellation_layer3_repo_root: /srv/src/k2db

# Current cluster-oriented control defaults.
constellation_layer3_manager_host: manager@159.223.37.147
constellation_layer3_nomad_addr: http://127.0.0.1:4646
constellation_layer3_consul_http_addr: http://127.0.0.1:8500
constellation_layer3_vault_addr: http://127.0.0.1:8200
constellation_layer3_nomad_namespace: default
constellation_layer3_render_dir: /tmp/frogfish-layer3

# Current scripts support both vault and nomad-var. This baseline starts with
# vault because the repo already documents the live Vault conventions for most
# services.
constellation_layer3_deploy_mode: vault
constellation_layer3_use_published_images: true

constellation_layer3_install_order:
  - k2db-api
  - k2rbac-api
  - k2login
  - k2hello
  - k2mx-api

constellation_layer3_services:
  k2db-api:
    enabled: true
    job_name: k2db-api
    image_repo: docker.io/frogfishio/k2db-api-server
    image_tag: 20260322061156
    build_tag: 20260322061156
    roll_id: 20260322061156
    public_domain: k2db.frogfish.io
    # Current control-plane database name from repo defaults and local setup.
    system_db_name: k2_system
    # Current deploy-script convention: `nomad/jobs/<job_name>`.
    nomad_var_path: nomad/jobs/k2db-api
    vault_enabled: true
    vault_role: k2db-api
    # The repo defines the field name but does not currently pin one single
    # blessed live Vault path for the Mongo URI. Bind this to the real cluster
    # path instead of guessing.
    vault_mongo_uri_path: ""
    vault_mongo_uri_key: mongo_uri
    vault_mongo_uri_cli_path: ""
    # Source from the real control-plane bootstrap secret. This should normally
    # be injected only into init/recover/config-set execution, not into the
    # steady-state runtime task environment.
    bootstrap_token: ""
    # Fill with the real cluster path if Vault is the source of truth.
    bootstrap_token_vault_path: ""
    bootstrap_token_vault_key: bootstrap_token
    # Source of truth: real cluster Mongo connection string, normally from Vault.
    mongo_uri: ""

  k2rbac-api:
    enabled: true
    job_name: k2rbac-api
    image_repo: docker.io/frogfishio/k2rbac-api-server
    image_tag: 20260322135229
    build_tag: 20260322135229
    roll_id: 20260322135229
    excluded_host: frogfish01
    public_domain: auth.frogfish.io
    login_domain: login.frogfish.io
    # Current deploy-script convention: `nomad/jobs/<job_name>`.
    nomad_var_path: nomad/jobs/k2rbac-api
    vault_enabled: true
    vault_role: k2rbac-api
    vault_jwt_secret_path: kv/data/k2/rbac-api
    vault_jwt_secret_key: jwt_secret
    vault_k2db_api_key_path: kv/data/k2/rbac-api
    vault_k2db_api_key_key: api_key
    vault_k2mx_api_key_path: kv/data/k2/rbac-api-mail
    vault_k2mx_api_key_key: api_key
    # Source of truth: RBAC signing secret from Vault path above.
    jwt_secret: ""
    # Source of truth: k2db runtime API key stored for RBAC at the Vault path above.
    k2db_api_key: ""
    # Optional mail-plane key. Leave empty if the environment does not wire RBAC -> k2mx mail delivery.
    k2mx_api_key: ""

  k2login:
    enabled: true
    job_name: k2login
    image_repo: docker.io/frogfishio/k2login-server
    image_tag: 20260322143907
    build_tag: 20260322143907
    roll_id: 20260322143907
    public_domain: login.frogfish.io
    auth_domain: auth.frogfish.io
    hello_domain: hello.frogfish.io
    hello_alt_domain: hello.ramblerbooks.com
    # Current deploy-script convention: `nomad/jobs/<job_name>`.
    nomad_var_path: nomad/jobs/k2login
    vault_enabled: true
    vault_role: k2login
    vault_rbac_api_key_path: kv/data/k2/login
    vault_rbac_api_key_key: api_key
    # Source of truth: RBAC API key stored at the Vault path above.
    rbac_api_key: ""

  k2hello:
    enabled: true
    job_name: k2hello
    image_repo: docker.io/frogfishio/k2hello
    # Fill from the live hello deploy or release record. The repo does not yet
    # pin one current hello build tag in the cluster inventory document.
    image_tag: ""
    build_tag: ""
    roll_id: ""
    public_domain: hello.frogfish.io
    login_domain: login.frogfish.io
    # Current deploy-script convention: `nomad/jobs/<job_name>`.
    nomad_var_path: nomad/jobs/k2hello
    # Source of truth: generate per environment and store in infra secret management.
    session_secret: ""

  k2mx-api:
    enabled: false
    job_name: k2mx-api
    image_repo: docker.io/frogfishio/k2mx-api-server
    image_tag: 20260322153737
    build_tag: 20260322153737
    roll_id: 20260322153737
    # Current deploy-script convention: `nomad/jobs/<job_name>`.
    nomad_var_path: nomad/jobs/k2mx-api
    vault_enabled: true
    vault_role: k2mx-api
    vault_k2db_api_key_path: kv/data/k2/mx
    vault_k2db_api_key_key: api_key
    vault_bootstrap_token_path: kv/data/k2/mx
    vault_bootstrap_token_key: bootstrap_token
    vault_ui_session_secret_path: kv/data/k2/mx-ui
    vault_ui_session_secret_key: session_secret
    # Source of truth: k2db runtime API key stored at the Vault path above.
    k2db_api_key: ""
    # Current docs already pin the Vault path for this bootstrap token.
    bootstrap_token: ""
    # Source of truth: generated per environment and stored at the Vault path above.
    ui_session_secret: ""

constellation_layer3_core_init:
  enabled: true
  k2db_runtime_config:
    api_listen_host: 0.0.0.0
    api_listen_port: 3000
    admin_api_enabled: false
  rbac_first_admin:
    email: admin@frogfish.io
    # Source of truth: generated for the environment at first bootstrap only.
    password: ""

constellation_layer3_acceptance:
  enabled: true
  wait_retries: 30
  wait_delay: 10
  check_wrong_password_fast_fail: true
  check_login_handoff_via_hello: true