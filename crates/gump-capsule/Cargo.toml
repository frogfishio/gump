[package]
name = "gump-capsule"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "gump/deployment/1 Capsule dialect: streaming R/W over capsule-lib v0001 (F04)."

[dependencies]
gump-types = { workspace = true }
